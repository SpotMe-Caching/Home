<!DOCTYPE html>
<html lang="de">
<head>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SpotMe · Live Spot verwalten</title>
<meta name="theme-color" content="#080b10">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b10;--sur:#0d1117;--card:#111820;--card2:#141e2a;
  --bord:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.12);
  --acc:#ff9f00;--acc-dim:rgba(255,159,0,0.10);--acc-glow:rgba(255,159,0,0.28);
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.08);--cyan-glow:rgba(0,229,255,0.28);
  --green:#00e676;--red:#ff1744;--text:#dce8f0;--muted:#4a6070;--muted2:#7a98aa;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}

/* Header */
.page-header{
  display:flex;align-items:center;gap:0.75rem;
  padding:max(0.85rem,env(safe-area-inset-top)) 1rem 0.85rem;
  background:rgba(8,11,16,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bord2);position:sticky;top:0;z-index:100;
}
.logo{font-family:'Space Mono',monospace;font-size:0.9rem;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:6px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pdot 2s ease infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.back-btn{padding:6px 14px;border-radius:40px;background:var(--card);border:1px solid var(--bord2);color:var(--muted2);font-size:0.78rem;font-family:'Outfit',sans-serif;cursor:pointer}

/* Layout */
.content{padding:1rem;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:0.85rem;padding-bottom:3rem}

/* Section */
.section{background:var(--card);border:1px solid var(--bord);border-radius:16px;overflow:hidden}
.section-head{
  padding:0.75rem 1rem;border-bottom:1px solid var(--bord);
  font-family:'Space Mono',monospace;font-size:0.65rem;font-weight:700;
  color:var(--muted);letter-spacing:0.1em;
  background: linear-gradient(rgba(255,159,0,0.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,159,0,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}
.section-body{padding:1rem}

/* Status pill */
.status-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:0.5rem 1rem;border-radius:100px;
  font-family:'Space Mono',monospace;font-size:0.78rem;font-weight:700;
  margin-bottom:0.75rem;
}
.status-pill.online{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green)}
.status-pill.offline{background:var(--card2);border:1px solid var(--bord2);color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.status-dot.pulse{animation:pdot 1.5s ease infinite}

/* Map */
#liveMap{width:100%;height:190px;border-radius:12px;overflow:hidden;border:1px solid var(--bord2);margin-bottom:0.75rem;cursor:crosshair}

/* Inputs */
.finp-label{display:block;font-size:0.7rem;color:var(--muted2);font-weight:500;margin-bottom:0.3rem;margin-top:0.65rem}
.finp{width:100%;padding:0.65rem 0.9rem;border-radius:11px;background:var(--bg);border:1px solid var(--bord2);color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.18s}
.finp:focus{border-color:var(--acc-glow)}
textarea.finp{resize:none;min-height:72px;line-height:1.45}
select.finp{appearance:none;cursor:pointer}

/* Buttons */
.btn{width:100%;padding:0.85rem;border-radius:13px;border:none;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.18s;margin-top:0.5rem}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.btn-live{background:var(--green);color:#080b10}
.btn-offline{background:rgba(255,23,68,0.12);border:1px solid rgba(255,23,68,0.3);color:var(--red)}
.btn-update{background:var(--acc-dim);border:1px solid var(--acc-glow);color:var(--acc)}
.btn-save{background:var(--acc);color:#080b10}
.btn-ghost{background:transparent;border:1px solid var(--bord2);color:var(--muted2)}
.btn-danger{background:rgba(255,23,68,0.08);border:1px solid rgba(255,23,68,0.2);color:var(--red)}

/* Avatar upload */
.avatar-upload{display:flex;align-items:center;gap:0.85rem;margin-bottom:0.5rem}
.avatar-preview{
  width:56px;height:56px;border-radius:14px;
  background:var(--acc-dim);border:1px solid var(--acc-glow);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;overflow:hidden;cursor:pointer;
  position:relative;
}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-preview-hint{font-size:0.75rem;color:var(--muted2);line-height:1.4}
#avatarInput{display:none}

/* Spot selector */
.spot-select-list{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem}
.spot-select-item{
  background:var(--card2);border:1px solid var(--bord);border-radius:11px;
  padding:0.65rem 0.85rem;cursor:pointer;display:flex;align-items:center;gap:0.65rem;
  transition:all 0.18s;
}
.spot-select-item.active{background:var(--acc-dim);border-color:var(--acc-glow)}
.spot-select-item-name{font-size:0.88rem;font-weight:600;flex:1}
.spot-select-item-status{font-size:0.65rem;font-family:'Space Mono',monospace;font-weight:700}

/* Map tap hint */
.map-hint{font-size:0.75rem;color:var(--muted2);text-align:center;margin-bottom:0.5rem;font-family:'Space Mono',monospace;letter-spacing:0.03em}

/* Follower count */
.follower-badge{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--cyan);background:var(--cyan-dim);border:1px solid var(--cyan-glow);border-radius:100px;padding:2px 8px}

/* Toast */
.toast{position:fixed;bottom:max(1.5rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:rgba(8,11,16,0.96);backdrop-filter:blur(20px);border:1px solid var(--bord2);border-radius:100px;padding:0.5rem 1.2rem;font-size:0.82rem;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty */
.empty{text-align:center;color:var(--muted2);font-size:0.85rem;padding:1.5rem 0}
</style>
</head>
<body>

<div class="page-header">
  <div class="logo"><div class="logo-dot"></div>LIVE SPOTS</div>
  <div style="flex:1"></div>
  <button class="back-btn" onclick="location.href='/'">← App</button>
</div>

<div class="content" id="content">
  <div class="empty" style="padding:3rem 0;">⏳ Lädt…</div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="avatarInput" accept="image/*">

<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<script>
'use strict';
const API  = 'https://spotme-chat-obom.onrender.com/api';
const CODE = localStorage.getItem('sm_code') || '';
const TOK  = localStorage.getItem('sm_token') || '';

const CATEGORY_EMOJI = {
  'Bahnhof':'🚉','Club':'🎉','Einkaufsviertel':'🛍️','Café':'☕',
  'Park':'🌳','Restaurant':'🍽️','Strand':'🏖️','Natur':'🌿',
  'Fitness':'💪','Aussicht':'⛰️','Sonstiges':'📌'
};

let mySpots   = [];
let activeSpot = null;
let liveMap    = null;
let liveMarker = null;
let tapCoords  = null;
let avatarB64  = null;
let toastTimer;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  if (!CODE || !TOK) {
    document.getElementById('content').innerHTML = `
      <div class="empty" style="padding:3rem 0;">
        ⚠️ Bitte zuerst in der App anmelden.<br>
        <a href="/" style="color:var(--acc);margin-top:1rem;display:block;">← Zur App</a>
      </div>`;
    return;
  }
  await loadMySpots();
  renderPage();
}

async function loadMySpots() {
  try {
    const r = await fetch(`${API}/live-spots/mine?code=${encodeURIComponent(CODE)}&token=${encodeURIComponent(TOK)}`);
    if (r.ok) mySpots = await r.json();
  } catch {}
}

// ── HAUPT-RENDER ─────────────────────────────────────────────────────────────
function renderPage() {
  const content = document.getElementById('content');

  if (!mySpots.length) {
    // Noch kein Live Spot – direkt Erstell-Formular zeigen
    content.innerHTML = createFormHTML(null);
    initCreateMap();
    bindAvatarUpload();
    return;
  }

  // Liste + aktiver Spot-Bereich
  const listItems = mySpots.map(s => {
    const online = s.status === 'online';
    const active = activeSpot?.id === s.id;
    return `<div class="spot-select-item ${active?'active':''}" onclick="selectSpot(${s.id})">
      <span style="font-size:1.1rem;">${CATEGORY_EMOJI[s.category]||'📡'}</span>
      <div class="spot-select-item-name">${esc(s.name)}</div>
      <span class="spot-select-item-status" style="color:${online?'var(--green)':'var(--muted)'}">
        ${online?'● LIVE':'○ Offline'}
      </span>
      <span class="follower-badge">👥 ${s.follower_count}</span>
    </div>`;
  }).join('');

  content.innerHTML = `
    <!-- Spot Auswahl -->
    <div class="section">
      <div class="section-head">MEINE LIVE SPOTS</div>
      <div class="section-body">
        <div class="spot-select-list">${listItems}</div>
        <button class="btn btn-ghost" onclick="showCreateForm()" style="margin-top:0;">
          ＋ Neuen Live Spot erstellen
        </button>
      </div>
    </div>

    <!-- Aktiver Spot Steuerung -->
    <div id="activeSpotPanel">
      ${activeSpot ? renderActivePanel(activeSpot) : '<div class="empty">Wähle einen Live Spot oben aus.</div>'}
    </div>
  `;
  bindAvatarUpload();
}

function renderActivePanel(s) {
  const online = s.status === 'online';
  return `
    <!-- Status + Live-Steuerung -->
    <div class="section">
      <div class="section-head">STEUERUNG · ${esc(s.name)}</div>
      <div class="section-body">
        <div class="status-pill ${online?'online':'offline'}">
          <div class="status-dot ${online?'pulse':''}"></div>
          ${online ? '● LIVE – Du bist sichtbar' : '○ Offline – Nicht sichtbar'}
        </div>

        ${online ? `
          <div class="map-hint">Tippe auf die Karte um den Standort zu aktualisieren</div>
          <div id="liveMap"></div>
          <span class="finp-label">Standort-Notiz (optional)</span>
          <input class="finp" id="locationNote" placeholder="z.B. Heute am Hauptbahnhof" value="${esc(s.location_note||'')}">
          <button class="btn btn-update" id="updateBtn" onclick="updateLocation()">
            📍 Standort aktualisieren
          </button>
          <button class="btn btn-offline" onclick="goOffline(${s.id})">
            ✕ Offline gehen
          </button>
        ` : `
          <div class="map-hint">Tippe auf die Karte um deinen Startpunkt zu setzen</div>
          <div id="liveMap"></div>
          <span class="finp-label">Standort-Notiz (optional)</span>
          <input class="finp" id="locationNote" placeholder="z.B. Heute am Marktplatz">
          <button class="btn btn-live" id="goLiveBtn" onclick="goLive(${s.id})">
            📡 Jetzt live gehen
          </button>
        `}
      </div>
    </div>

    <!-- Profil bearbeiten -->
    <div class="section">
      <div class="section-head">PROFIL BEARBEITEN</div>
      <div class="section-body">
        ${createFormHTML(s)}
        <button class="btn btn-save" onclick="saveProfile(${s.id})">
          💾 Profil speichern
        </button>
        <button class="btn btn-ghost" onclick="copyShareLink(${s.id})">
          🔗 Profil-Link kopieren
        </button>
        <button class="btn btn-danger" onclick="confirmDelete(${s.id})">
          🗑️ Live Spot löschen
        </button>
      </div>
    </div>
  `;
}

function createFormHTML(s) {
  const cats = Object.entries(CATEGORY_EMOJI).map(([k,v])=>`<option value="${k}" ${s?.category===k?'selected':''}>${v} ${k}</option>`).join('');
  return `
    <div class="avatar-upload">
      <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
        ${s?.avatar ? `<img src="${s.avatar}" id="avatarImg">` : `<span id="avatarImg">${CATEGORY_EMOJI[s?.category]||'📡'}</span>`}
      </div>
      <div class="avatar-preview-hint">
        <div style="font-weight:600;margin-bottom:2px;">Profilbild</div>
        <div>Tippe zum Ändern<br>Quadratisch empfohlen</div>
      </div>
    </div>
    <span class="finp-label">Name / Künstlername</span>
    <input class="finp" id="lsName" placeholder="z.B. Straßenmusiker Berlin" maxlength="80" value="${esc(s?.name||'')}">
    <span class="finp-label">Beschreibung</span>
    <textarea class="finp" id="lsDesc" placeholder="Was machst du? Wann bist du wo?" maxlength="300">${esc(s?.description||'')}</textarea>
    <span class="finp-label">Kategorie</span>
    <select class="finp" id="lsCat">${cats}</select>
    ${!s ? `<button class="btn btn-save" onclick="createLiveSpot()" style="margin-top:0.75rem;">📡 Live Spot anlegen</button>` : ''}
  `;
}

// ── MAP ───────────────────────────────────────────────────────────────────────
function initLiveMap(existingLat, existingLng) {
  if (liveMap) { liveMap.remove(); liveMap = null; liveMarker = null; tapCoords = null; }
  const center = existingLat ? [existingLng, existingLat] : [0, 20];
  liveMap = new maplibregl.Map({
    container: 'liveMap',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center, zoom: existingLat ? 14 : 4,
    attributionControl: false
  });
  // Aktuellen Standort anzeigen
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      if (!liveMap) return;
      liveMap.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14 });
    });
  }
  liveMap.on('click', e => {
    tapCoords = { lat: e.lngLat.lat, lng: e.lngLat.lng };
    if (liveMarker) liveMarker.remove();
    const el = document.createElement('div');
    el.style.cssText = 'width:20px;height:20px;background:var(--green);border-radius:50%;border:3px solid white;box-shadow:0 0 14px rgba(0,230,118,0.9);';
    liveMarker = new maplibregl.Marker({ element: el })
      .setLngLat([tapCoords.lng, tapCoords.lat]).addTo(liveMap);
    toast('📍 Standort gesetzt');
  });
  if (existingLat) {
    tapCoords = { lat: existingLat, lng: existingLng };
    liveMap.on('load', () => {
      const el = document.createElement('div');
      el.style.cssText = 'width:20px;height:20px;background:var(--green);border-radius:50%;border:3px solid white;box-shadow:0 0 14px rgba(0,230,118,0.9);';
      liveMarker = new maplibregl.Marker({ element: el })
        .setLngLat([existingLng, existingLat]).addTo(liveMap);
    });
  }
}

function initCreateMap() {
  setTimeout(() => initLiveMap(null, null), 80);
}

// ── AKTIONEN ─────────────────────────────────────────────────────────────────
function selectSpot(id) {
  activeSpot = mySpots.find(s => s.id === id) || null;
  avatarB64  = activeSpot?.avatar || null;
  renderPage();
  // Map nach dem Render initialisieren
  if (activeSpot) setTimeout(() => initLiveMap(activeSpot.lat, activeSpot.lng), 80);
}

async function goLive(id) {
  const coords = tapCoords || (activeSpot?.lat ? { lat: activeSpot.lat, lng: activeSpot.lng } : null);
  if (!coords) { toast('⚠️ Bitte einen Standort auf der Karte antippen'); return; }
  const btn = document.getElementById('goLiveBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const note = document.getElementById('locationNote')?.value.trim();
    const r = await fetch(`${API}/live-spots/${id}/golive`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK, lat: coords.lat, lng: coords.lng, location_note: note })
    });
    if (r.ok) {
      toast('📡 Du bist jetzt live!');
      await loadMySpots();
      activeSpot = mySpots.find(s => s.id === id) || null;
      renderPage();
      if (activeSpot) setTimeout(() => initLiveMap(activeSpot.lat, activeSpot.lng), 80);
    } else {
      const d = await r.json();
      toast('❌ ' + (d.error || 'Fehler'));
    }
  } catch { toast('⚠️ Verbindungsfehler'); }
  if (btn) { btn.disabled = false; }
}

async function goOffline(id) {
  if (!confirm('Live Spot offline schalten?')) return;
  try {
    await fetch(`${API}/live-spots/${id}/gooffline`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK })
    });
    toast('○ Offline – du bist nicht mehr sichtbar');
    await loadMySpots();
    activeSpot = mySpots.find(s => s.id === id) || null;
    renderPage();
    if (activeSpot) setTimeout(() => initLiveMap(null, null), 80);
  } catch { toast('⚠️ Fehler'); }
}

async function updateLocation() {
  const coords = tapCoords;
  if (!coords) { toast('⚠️ Bitte neuen Standort auf der Karte antippen'); return; }
  const btn = document.getElementById('updateBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const note = document.getElementById('locationNote')?.value.trim();
    await fetch(`${API}/live-spots/${activeSpot.id}/golive`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK, lat: coords.lat, lng: coords.lng, location_note: note })
    });
    toast('📍 Standort aktualisiert!');
    await loadMySpots();
    activeSpot = mySpots.find(s => s.id === activeSpot.id) || null;
  } catch { toast('⚠️ Fehler'); }
  if (btn) { btn.disabled = false; btn.textContent = '📍 Standort aktualisieren'; }
}

async function saveProfile(id) {
  const name = document.getElementById('lsName')?.value.trim();
  const desc = document.getElementById('lsDesc')?.value.trim();
  const cat  = document.getElementById('lsCat')?.value;
  if (!name) { toast('⚠️ Name erforderlich'); return; }
  try {
    await fetch(`${API}/live-spots/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK, name, description: desc, category: cat, avatar: avatarB64 })
    });
    toast('✅ Profil gespeichert');
    await loadMySpots();
    activeSpot = mySpots.find(s => s.id === id) || null;
    renderPage();
    if (activeSpot) setTimeout(() => initLiveMap(activeSpot.lat, activeSpot.lng), 80);
  } catch { toast('⚠️ Fehler beim Speichern'); }
}

async function createLiveSpot() {
  const name = document.getElementById('lsName')?.value.trim();
  const desc = document.getElementById('lsDesc')?.value.trim();
  const cat  = document.getElementById('lsCat')?.value;
  if (!name) { toast('⚠️ Bitte einen Namen eingeben'); return; }
  try {
    const r = await fetch(`${API}/live-spots`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK, name, description: desc, category: cat, avatar: avatarB64 })
    });
    const data = await r.json();
    if (!r.ok) { toast('❌ ' + (data.error||'Fehler')); return; }
    toast('✅ Live Spot erstellt!');
    await loadMySpots();
    activeSpot = mySpots[0] || null;
    renderPage();
    if (activeSpot) setTimeout(() => initLiveMap(null, null), 80);
  } catch { toast('⚠️ Verbindungsfehler'); }
}

async function confirmDelete(id) {
  if (!confirm('Live Spot wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
  try {
    await fetch(`${API}/live-spots/${id}`, {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK })
    });
    toast('🗑️ Live Spot gelöscht');
    await loadMySpots();
    activeSpot = null;
    renderPage();
  } catch { toast('⚠️ Fehler'); }
}

function copyShareLink(id) {
  const url = `${window.location.origin}/live-spot.html?id=${id}`;
  navigator.clipboard?.writeText(url)
    .then(() => toast('🔗 Link kopiert!'))
    .catch(() => toast('⚠️ Kopieren fehlgeschlagen'));
}

function showCreateForm() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="section">
      <div class="section-head">NEUER LIVE SPOT</div>
      <div class="section-body">
        ${createFormHTML(null)}
      </div>
    </div>
    <button class="btn btn-ghost" onclick="renderPage()">Abbrechen</button>
  `;
  bindAvatarUpload();
  initCreateMap();
}

// ── AVATAR ────────────────────────────────────────────────────────────────────
function bindAvatarUpload() {
  const input = document.getElementById('avatarInput');
  if (!input) { console.warn('avatarInput nicht gefunden'); return; }
  input.addEventListener('change', e => {
    console.log('change-Event ausgelöst');
    const file = e.target.files[0];
    if (!file) { console.warn('Keine Datei ausgewählt'); return; }
    console.log('Datei:', file.name, file.type, file.size);

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 200;
    const ctx = canvas.getContext('2d');
    const img = new Image();

    img.onerror = (err) => {
      console.error('Bild konnte nicht geladen werden:', err);
      toast('❌ Bild konnte nicht geladen werden');
    };

    img.onload = () => {
      console.log('Bild geladen:', img.width, img.height);
      const s = Math.min(img.width, img.height);
      const ox = (img.width - s) / 2, oy = (img.height - s) / 2;
      ctx.drawImage(img, ox, oy, s, s, 0, 0, 200, 200);
      avatarB64 = canvas.toDataURL('image/jpeg', 0.72);
      console.log('avatarB64 gesetzt, Länge:', avatarB64.length);

      const preview = document.getElementById('avatarImg');
      if (preview) {
        if (preview.tagName === 'IMG') preview.src = avatarB64;
        else {
          const img2 = document.createElement('img');
          img2.src = avatarB64; img2.id = 'avatarImg';
          img2.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:14px;';
          preview.parentNode.replaceChild(img2, preview);
        }
      } else {
        console.warn('avatarImg-Element nicht gefunden, Vorschau kann nicht aktualisiert werden');
      }
      toast('✅ Bild bereit – beim Speichern wird es hochgeladen');
    };
    img.src = URL.createObjectURL(file);
    input.value = '';
  });
}

init();
</script>
</body>
</html>
