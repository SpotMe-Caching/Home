<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SpotMe · Öffentlicher Spot</title>
  <meta name="theme-color" content="#0a0d12">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background: #0a0d12;
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 0 0 env(safe-area-inset-bottom);
    }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.1rem; padding-top: max(0.85rem, env(safe-area-inset-top));
      background: rgba(10,13,18,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 1rem; font-weight: 700;
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse-dot 2s ease infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
    .back-link {
      font-size: 0.8rem;
      background: rgba(15,19,24,0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 6px 14px;
      color: #94a3b8;
      text-decoration: none;
    }
    #map {
      width: 100%;
      height: 280px;
      filter: brightness(0.85);
    }
    .content {
      padding: 1.25rem 1.1rem 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .spot-name {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0.5rem 0 0.3rem;
      color: #f59e0b;
    }
    .spot-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      color: #f59e0b;
      font-family: 'Space Mono', monospace;
    }
    .spot-desc {
      background: #141a22;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 1rem;
      margin: 1rem 0;
      line-height: 1.55;
      color: #94a3b8;
    }
    .error-state {
      text-align: center;
      padding: 2rem;
      color: #ef4444;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20,26,34,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 60px;
      padding: 10px 20px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="logo"><div class="logo-dot"></div>SPOT<span style="font-weight:300">ME</span></div>
    <a href="/" class="back-link">← App öffnen</a>
  </div>
  <div id="map"></div>
  <div class="content" id="content">
    <div class="error-state">⏳ Lade Spot…</div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
  <script>
    const API = 'https://spotme-chat-obom.onrender.com/api';
    let map = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function initMap(lat, lng) {
      if (map) map.remove();
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [lng, lat],
        zoom: 14,
        attributionControl: false
      });
      map.on('load', () => {
        const el = document.createElement('div');
        el.style.cssText = 'width:22px;height:22px;background:#f59e0b;border-radius:50%;border:3px solid white;box-shadow:0 0 18px rgba(245,158,11,0.85);';
        new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
      });
    }

    const params = new URLSearchParams(window.location.search);
    const spotId = params.get('id');

    if (!spotId) {
      document.getElementById('content').innerHTML = '<div class="error-state">❌ Keine Spot-ID angegeben.</div>';
    } else {
      fetch(`${API}/userspots/${spotId}`)
        .then(res => {
          if (!res.ok) throw new Error('Spot nicht gefunden');
          return res.json();
        })
        .then(spot => {
          initMap(spot.lat, spot.lng);
          document.getElementById('content').innerHTML = `
            <div class="spot-name">${escapeHtml(spot.name)}</div>
            <div class="spot-meta">
              <span class="tag">${escapeHtml(spot.wishTag || 'Treffpunkt')}</span>
            </div>
            ${spot.description ? `<div class="spot-desc">${escapeHtml(spot.description)}</div>` : ''}
            <div style="font-size:0.8rem; color:#64748b; text-align:center; margin-top:1rem;">
              🗺️ Spot erstellt über SpotMe Caching
            </div>
          `;
        })
        .catch(err => {
          console.error(err);
          document.getElementById('content').innerHTML = '<div class="error-state">❌ Spot nicht gefunden oder nicht öffentlich.</div>';
        });
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
