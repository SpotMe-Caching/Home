
<div class="toast" id="toast"></div>

<script>
'use strict';

}

// ── BLUESKY ─────────────────────────────────────────────────────────────────
async function loadBlueskyStatus() {
  const code = localStorage.getItem('sm_code');
  const token = localStorage.getItem('sm_token');
  const statusText = document.getElementById('bsky-status-text');
  const connectForm = document.getElementById('bsky-connect-form');
  const connectedInfo = document.getElementById('bsky-connected-info');
  
  if (!code || !token) {
    statusText.innerHTML = '⚠️ Bitte fülle zuerst dein Profil aus und speichere es, um Bluesky verbinden zu können.';
    connectForm.style.display = 'none';
    connectedInfo.style.display = 'none';
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/bluesky/status/${code}?token=${token}`);
    const data = await res.json();
    if (data.connected) {
      connectForm.style.display = 'none';
      connectedInfo.style.display = 'block';
      document.getElementById('bsky-connected-handle').textContent = data.handle;
      statusText.innerHTML = '✅ Bluesky-Konto ist erfolgreich mit SpotMe verknüpft.';
    } else {
      connectForm.style.display = 'block';
      connectedInfo.style.display = 'none';
      statusText.innerHTML = '⚡ Dein Account ist aktuell nicht mit Bluesky verbunden.';
    }
  } catch(e) {
    statusText.innerHTML = '⚠️ Bluesky-Status konnte nicht geladen werden (Server-Fehler).';
  }
}

async function connectBluesky() {
  const handle = document.getElementById('bsky-handle').value.trim();
  const appPassword = document.getElementById('bsky-app-password').value.trim();
  if (!handle || !appPassword) { toast('⚠️ Bitte Handle und App-Passwort eingeben'); return; }
  const code = localStorage.getItem('sm_code');
  const token = localStorage.getItem('sm_token');
  if (!code || !token) { toast('⚠️ Kein Profil gefunden'); return; }
  
  const btn = document.getElementById('bsky-connect-btn');
  btn.disabled = true; btn.textContent = '⏳ Verbinde…';
  try {
    const res = await fetch(`${API_BASE}/bluesky/connect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, token, handle, appPassword })
    });
    const data = await res.json();
    if (res.ok) {
      toast('✅ Bluesky erfolgreich verbunden');
      loadBlueskyStatus();
    } else {
      toast('❌ ' + (data.error || 'Verbindung fehlgeschlagen'));
    }
  } catch(e) {
    toast('⚠️ Server nicht erreichbar');
  } finally {
    btn.disabled = false; btn.textContent = '🔗 Verbindung herstellen';
    document.getElementById('bsky-app-password').value = '';
  }
}

async function disconnectBluesky() {
  const code = localStorage.getItem('sm_code');
  const token = localStorage.getItem('sm_token');
  if (!code || !token) return;
  if (!confirm('Bluesky-Verbindung wirklich trennen?')) return;
  try {
    await fetch(`${API_BASE}/bluesky/disconnect`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, token })
    });
    toast('🔌 Verbindung getrennt');
    loadBlueskyStatus();
  } catch(e) {
    toast('⚠️ Fehler beim Trennen');
  }
}
