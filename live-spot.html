<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SpotMe · Live Spot</title>
<meta name="theme-color" content="#080b10">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b10;--sur:#0d1117;--card:#111820;--card2:#141e2a;
  --bord:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.12);
  --acc:#ff9f00;--acc-dim:rgba(255,159,0,0.10);--acc-glow:rgba(255,159,0,0.28);
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.08);
  --green:#00e676;--red:#ff1744;--text:#dce8f0;--muted:#4a6070;--muted2:#7a98aa;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}

.page-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:max(0.85rem,env(safe-area-inset-top)) 1rem 0.85rem;
  background:rgba(8,11,16,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bord2);position:sticky;top:0;z-index:100;
}
.logo{font-family:'Space Mono',monospace;font-size:0.9rem;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:6px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pdot 2s ease infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.back-link{font-size:0.8rem;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--bord2);border-radius:40px;padding:6px 14px;color:var(--muted2);text-decoration:none}

#map{width:100%;height:48vmax;max-height:280px;filter:invert(0.88) hue-rotate(180deg) brightness(0.82) saturate(0.85)}
.content{padding:1.1rem;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:0.85rem;padding-bottom:2rem}

/* Avatar */
.profile-head{display:flex;align-items:center;gap:0.85rem}
.avatar{width:56px;height:56px;border-radius:15px;background:var(--acc-dim);border:1px solid var(--acc-glow);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;box-shadow:0 0 18px rgba(255,159,0,0.15);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:1.1rem;font-weight:700;margin-bottom:3px}
.profile-cat{font-size:0.72rem;color:var(--muted2);font-family:'Space Mono',monospace}

/* Status badge */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;font-family:'Space Mono',monospace}
.status-badge.online{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green)}
.status-badge.offline{background:var(--card2);border:1px solid var(--bord2);color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.status-dot.pulse{animation:pdot 1.5s ease infinite}

/* Info card */
.info-card{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:0.9rem 1rem;position:relative;overflow:hidden}
.info-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc-glow),transparent)}
.info-label{font-family:'Space Mono',monospace;font-size:0.6rem;font-weight:700;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.4rem}
.info-text{font-size:0.88rem;color:var(--muted2);line-height:1.5}
.location-note{font-size:0.85rem;font-weight:600;color:var(--text)}

/* Stats */
.stats-row{display:flex;gap:0.5rem}
.stat-box{flex:1;background:var(--card2);border:1px solid var(--bord);border-radius:12px;padding:0.65rem;text-align:center}
.stat-val{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;color:var(--cyan)}
.stat-label{font-size:0.62rem;color:var(--muted2);margin-top:2px}

/* Buttons */
.btn-row{display:flex;gap:0.5rem}
.btn{flex:1;padding:0.8rem;border-radius:13px;border:none;font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.4rem;transition:all 0.18s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--acc);color:#080b10}
.btn-follow{background:var(--cyan-dim);border:1px solid var(--cyan);color:var(--cyan)}
.btn-follow.following{background:rgba(0,230,118,0.08);border-color:var(--green);color:var(--green)}
.btn-nav{background:rgba(255,255,255,0.05);border:1px solid var(--bord2);color:var(--muted2)}

/* Toast */
.toast{position:fixed;bottom:max(1.5rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:rgba(8,11,16,0.96);backdrop-filter:blur(20px);border:1px solid var(--bord2);border-radius:100px;padding:0.5rem 1.2rem;font-size:0.82rem;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:0.75rem;color:var(--muted2);font-size:0.88rem}
.loading-icon{font-size:2.5rem;opacity:0.4}
</style>
</head>
<body>

<div class="page-header">
  <div class="logo"><div class="logo-dot"></div>SPOT<span style="font-weight:300">ME</span></div>
  <span class="back-link" style="cursor:pointer;" onclick="goToApp()">← App</span>
</div>

<div id="map"></div>
<div class="content" id="content">
  <div class="loading"><div class="loading-icon">📡</div>Lädt Live Spot…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<script>
'use strict';
const API  = 'https://spotme-chat-obom.onrender.com/api';
const CODE = localStorage.getItem('sm_code') || '';
const TOK  = localStorage.getItem('sm_token') || '';
let spotMap = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

function goToApp() {
  const referrer = document.referrer || '';
  const origin = window.location.origin;
  if (referrer.startsWith(origin) && window.history.length > 1) {
    history.back();
  } else {
    window.location.href = '/';
  }
}

function initMap(lat, lng) {
  if (spotMap) spotMap.remove();
  spotMap = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [lng, lat], zoom: 14,
    interactive: false, attributionControl: false
  });
  spotMap.on('load', () => {
    const el = document.createElement('div');
    el.style.cssText = 'width:22px;height:22px;background:#00e676;border-radius:50%;border:3px solid white;box-shadow:0 0 16px rgba(0,230,118,0.9);';
    new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(spotMap);
  });
}

async function loadSpot(id) {
  const content = document.getElementById('content');
  let spot;
  try {
    const r = await fetch(`${API}/live-spots/${id}`);
    if (!r.ok) throw new Error('not_found');
    spot = await r.json();
  } catch {
    content.innerHTML = `<div class="loading"><div class="loading-icon">🔍</div>Live Spot nicht gefunden.<br><a href="/" style="color:var(--acc);margin-top:1rem;display:block;">← Zur App</a></div>`;
    return;
  }

  if (spot.lat && spot.lng) initMap(+spot.lat, +spot.lng);

  // Follow-Status prüfen
  let isFollowing = false;
  if (CODE) {
    try {
      const fr = await fetch(`${API}/live-spots/following?code=${CODE}&token=${TOK}`);
      if (fr.ok) {
        const list = await fr.json();
        isFollowing = list.some(s => s.id === spot.id);
      }
    } catch {}
  }

  const online = spot.status === 'online';
  const EMOJI = { 'Park':'🌳','Restaurant':'🍽️','Strand':'🏖️','Café':'☕','Club':'🎉','Fitness':'💪','Natur':'🌿','Bahnhof':'🚉','Sonstiges':'📌' };
  const catIcon = EMOJI[spot.category] || '📡';

  const timeAgo = t => {
    const m = Math.round((Date.now()-new Date(t))/60000);
    if (m < 1) return 'Gerade eben';
    if (m < 60) return `vor ${m} Min`;
    if (m < 1440) return `vor ${Math.floor(m/60)}h`;
    return `vor ${Math.floor(m/1440)} Tagen`;
  };

  content.innerHTML = `
    <div class="profile-head">
      <div class="avatar">${spot.avatar?`<img src="${spot.avatar}" alt="">`:`${catIcon}`}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(spot.name)}</div>
        <div class="profile-cat">${spot.category||'Live Spot'}</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
      <div class="status-badge ${online?'online':'offline'}">
        <div class="status-dot ${online?'pulse':''}"></div>
        ${online ? 'LIVE' : 'Offline'}
      </div>
      <span style="font-size:0.72rem;color:var(--muted2);">Aktualisiert ${timeAgo(spot.updated_at)}</span>
    </div>

    ${spot.description ? `
    <div class="info-card">
      <div class="info-label">ÜBER DIESEN SPOT</div>
      <div class="info-text">${esc(spot.description)}</div>
    </div>` : ''}

    ${online && spot.location_note ? `
    <div class="info-card">
      <div class="info-label">📍 AKTUELLER STANDORT</div>
      <div class="location-note">${esc(spot.location_note)}</div>
    </div>` : ''}

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val">👥 ${spot.follower_count}</div>
        <div class="stat-label">Follower</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" style="color:${online?'var(--green)':'var(--muted)'};">${online?'●':'○'}</div>
        <div class="stat-label">${online?'Live jetzt':'Offline'}</div>
      </div>
    </div>

    <div class="btn-row">
      ${CODE ? `<button class="btn btn-follow ${isFollowing?'following':''}" id="followBtn"
        onclick="toggleFollow(${spot.id})">
        ${isFollowing ? '✓ Gefolgt' : '+ Folgen'}
      </button>` : ''}
      ${online && spot.lat ? `<button class="btn btn-nav" onclick="navigate(${spot.lat},${spot.lng})">🧭 Route</button>` : ''}
    </div>

    ${!CODE ? `<div style="font-size:0.78rem;color:var(--muted2);text-align:center;">
      <a href="/" style="color:var(--acc);">App öffnen</a> um zu folgen und Benachrichtigungen zu erhalten.
    </div>` : ''}
  `;
}

let currentlyFollowing = false;
async function toggleFollow(id) {
  if (!CODE) { showToast('⚠️ Bitte in der App anmelden'); return; }
  const btn = document.getElementById('followBtn');
  const following = btn.classList.contains('following');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/live-spots/${id}/follow`, {
      method: following ? 'DELETE' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK })
    });
    if (r.ok) {
      btn.classList.toggle('following');
      btn.textContent = btn.classList.contains('following') ? '✓ Gefolgt' : '+ Folgen';
      showToast(btn.classList.contains('following') ? '✅ Du folgst jetzt!' : '🔕 Entfolgt');
    }
  } catch { showToast('⚠️ Verbindungsfehler'); }
  btn.disabled = false;
}

function navigate(lat, lng) {
  if (!navigator.geolocation) { showToast('❌ GPS nicht verfügbar'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    window.open(`https://www.google.com/maps/dir/${pos.coords.latitude},${pos.coords.longitude}/${lat},${lng}`,'_blank');
  }, () => window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,'_blank'));
}

const params = new URLSearchParams(window.location.search);
const id = params.get('id') || params.get('token');
if (id) loadSpot(id);
</script>
</body>
</html>
