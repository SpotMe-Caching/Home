<!DOCTYPE html>
<html lang="de">
<head>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SpotMe · Live Spot</title>
<meta name="theme-color" content="#080b10">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b10;--sur:#0d1117;--card:#111820;--card2:#141e2a;
  --bord:rgba(255,255,255,0.07);--bord2:rgba(255,255,255,0.12);
  --acc:#ff9f00;--acc-dim:rgba(255,159,0,0.10);--acc-glow:rgba(255,159,0,0.28);
  --cyan:#00e5ff;--cyan-dim:rgba(0,229,255,0.08);
  --green:#00e676;--red:#ff1744;--text:#dce8f0;--muted:#4a6070;--muted2:#7a98aa;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}

.page-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:max(0.85rem,env(safe-area-inset-top)) 1rem 0.85rem;
  background:rgba(8,11,16,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bord2);position:sticky;top:0;z-index:100;
}
.logo{font-family:'Space Mono',monospace;font-size:0.9rem;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:6px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pdot 2s ease infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.back-link{font-size:0.8rem;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--bord2);border-radius:40px;padding:6px 14px;color:var(--muted2);text-decoration:none}

#map{width:100%;height:48vmax;max-height:280px;filter:invert(0.88) hue-rotate(180deg) brightness(0.82) saturate(0.85)}
.content{padding:1.1rem;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:0.85rem;padding-bottom:2rem}

/* Avatar */
.profile-head{display:flex;align-items:center;gap:0.85rem}
.avatar{width:56px;height:56px;border-radius:15px;background:var(--acc-dim);border:1px solid var(--acc-glow);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;box-shadow:0 0 18px rgba(255,159,0,0.15);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:1.1rem;font-weight:700;margin-bottom:3px}
.profile-cat{font-size:0.72rem;color:var(--muted2);font-family:'Space Mono',monospace}

/* Status badge */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;font-family:'Space Mono',monospace}
.status-badge.online{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green)}
.status-badge.offline{background:var(--card2);border:1px solid var(--bord2);color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.status-dot.pulse{animation:pdot 1.5s ease infinite}

/* Info card */
.info-card{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:0.9rem 1rem;position:relative;overflow:hidden}
.info-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc-glow),transparent)}
.info-label{font-family:'Space Mono',monospace;font-size:0.6rem;font-weight:700;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.4rem}
.info-text{font-size:0.88rem;color:var(--muted2);line-height:1.5}
.location-note{font-size:0.85rem;font-weight:600;color:var(--text)}

/* Stats */
.stats-row{display:flex;gap:0.5rem}
.stat-box{flex:1;background:var(--card2);border:1px solid var(--bord);border-radius:12px;padding:0.65rem;text-align:center}
.stat-val{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;color:var(--cyan)}
.stat-label{font-size:0.62rem;color:var(--muted2);margin-top:2px}

/* Buttons */
.btn-row{display:flex;gap:0.5rem}
.btn{flex:1;padding:0.8rem;border-radius:13px;border:none;font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.4rem;transition:all 0.18s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--acc);color:#080b10}
.btn-follow{background:var(--cyan-dim);border:1px solid var(--cyan);color:var(--cyan)}
.btn-follow.following{background:rgba(0,230,118,0.08);border-color:var(--green);color:var(--green)}
.btn-nav{background:rgba(255,255,255,0.05);border:1px solid var(--bord2);color:var(--muted2)}

/* Toast */
.toast{position:fixed;bottom:max(1.5rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:rgba(8,11,16,0.96);backdrop-filter:blur(20px);border:1px solid var(--bord2);border-radius:100px;padding:0.5rem 1.2rem;font-size:0.82rem;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:0.75rem;color:var(--muted2);font-size:0.88rem}
.loading-icon{font-size:2.5rem;opacity:0.4}

/* ── Navigation Overlay (übernommen aus spotme.css, eigenständig — keine var() Abhängigkeit) ── */
#naviOverlay {
  position: fixed; inset: 0; z-index: 950;
  background: #0a0d12;
  display: none; flex-direction: column;
}

#chatOverlay { position: fixed; inset: 0; z-index: 960; background: #0a0d12; display: none; flex-direction: column; }
#chatOverlay.active { display: flex; }
.chat-overlay-header { padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.85rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.chat-bubble { max-width: 78%; padding: 0.55rem 0.8rem; border-radius: 14px; font-size: 0.88rem; line-height: 1.4; }
.chat-bubble.mine { align-self: flex-end; background: var(--acc); color: #080b10; border-bottom-right-radius: 4px; }
.chat-bubble.theirs { align-self: flex-start; background: #1a222c; color: #dce8f0; border-bottom-left-radius: 4px; }
.chat-bubble-author { display: block; font-size: 0.68rem; font-weight: 700; color: #22d3ee; margin-bottom: 2px; }
.chat-bubble-time { font-size: 0.62rem; opacity: 0.6; margin-top: 3px; text-align: right; }
.chat-input-row { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
.chat-input { flex: 1; background: #141a22; border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 0.65rem 1rem; color: #dce8f0; font-size: 0.88rem; }
.chat-send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--acc); border: none; color: #080b10; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }


#naviOverlay.active { display: flex; }
#naviMap { width: 100%; height: 100%; }

.navi-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.85rem;
  z-index: 10;
  display: flex; align-items: center; gap: 0.75rem;
  background: linear-gradient(to bottom, rgba(10,13,18,0.92) 0%, transparent 100%);
  pointer-events: none;
}
.navi-topbar > * { pointer-events: auto; }
.navi-close-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(15,19,24,0.9); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e2e8f0; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.navi-spot-label { flex: 1; min-width: 0; }
.navi-spot-label-name {
  font-weight: 700; font-size: 0.95rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.navi-spot-label-sub {
  font-size: 0.68rem; color: #64748b;
  font-family: 'Space Mono', monospace; margin-top: 1px;
}
.navi-recenter-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(15,19,24,0.9); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #22d3ee; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.navi-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0; z-index: 10;
  background: rgba(10,13,18,0.94);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px 22px 0 0;
  padding: 1rem 1.1rem;
  padding-bottom: max(1.1rem, env(safe-area-inset-bottom));
}
.navi-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 0.5rem; margin-bottom: 0.75rem;
}
.navi-stat {
  background: #141a22; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px; padding: 0.55rem 0.5rem; text-align: center;
}
.navi-stat-val {
  font-family: 'Space Mono', monospace; font-size: 0.88rem;
  font-weight: 700; color: #22d3ee; line-height: 1.2;
}
.navi-stat-val.amber { color: #f59e0b; }
.navi-stat-label { font-size: 0.6rem; color: #64748b; margin-top: 2px; }
.navi-legend {
  display: flex; gap: 1rem; margin-bottom: 0.65rem;
  font-size: 0.68rem; color: #64748b; align-items: center;
}
.navi-legend-dot {
  display: inline-block; width: 14px; height: 3px;
  border-radius: 2px; vertical-align: middle; margin-right: 4px;
}
.navi-stop-btn {
  width: 100%; padding: 0.75rem;
  background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 12px; color: #ef4444;
  font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 700;
  cursor: pointer; transition: all 0.18s;
}
.navi-stop-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<!-- Navigation Overlay -->
<div id="chatOverlay">
  <div class="chat-overlay-header">
    <button class="navi-close-btn" onclick="closeChatOverlay()" title="Schließen">✕</button>
    <div class="navi-spot-label">
      <div class="navi-spot-label-name" id="chatPartnerLabel">—</div>
      <div class="navi-spot-label-sub">CHAT</div>
    </div>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="Nachricht..." maxlength="500" onkeydown="if(event.key==='Enter')sendChatMsg()">
    <button class="chat-send-btn" onclick="sendChatMsg()">➤</button>
  </div>
</div>
<div id="naviOverlay">
  <div id="naviMap"></div>
  <div class="navi-topbar">
    <button class="navi-close-btn" onclick="closeNavOverlay()" title="Schließen">✕</button>
    <div class="navi-spot-label">
      <div class="navi-spot-label-name" id="naviSpotName">—</div>
      <div class="navi-spot-label-sub" id="naviSpotSub">NAVIGATION</div>
    </div>
    <button class="navi-recenter-btn" id="naviRecenterBtn" title="Neu zentrieren">⊕</button>
  </div>
  <div class="navi-bottom">
    <div class="navi-stats">
      <div class="navi-stat"><div class="navi-stat-val" id="naviDistVal">…</div><div class="navi-stat-label">Entfernung</div></div>
      <div class="navi-stat"><div class="navi-stat-val" id="naviFootVal">…</div><div class="navi-stat-label">🚶 zu Fuß</div></div>
      <div class="navi-stat"><div class="navi-stat-val amber" id="naviCarVal">…</div><div class="navi-stat-label">🚗 Auto</div></div>
    </div>
    <div class="navi-legend">
      <span><span class="navi-legend-dot" style="background:#22d3ee;"></span>Fußweg</span>
      <span><span class="navi-legend-dot" style="background:#f59e0b;"></span>Auto</span>
    </div>
    <button class="navi-stop-btn" onclick="closeNavOverlay()">■ Navigation beenden</button>
  </div>
</div>

<div class="page-header">
  <div class="logo"><div class="logo-dot"></div>SPOT<span style="font-weight:300">ME</span></div>
  <a href="/" class="back-link">← App</a>
</div>

<div id="map"></div>
<div class="content" id="content">
  <div class="loading"><div class="loading-icon">📡</div>Lädt Live Spot…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<script>
'use strict';
const API  = 'https://spotme-chat-obom.onrender.com/api';
const CODE = localStorage.getItem('sm_code') || '';
const TOK  = localStorage.getItem('sm_token') || '';
let spotMap = null;

// ── Globals, die das Navi-Overlay braucht ────────────────────────────────────
let userPos = null;
const ORS_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjI5NmQwYWMxYmM0MzQxNjdiOTE2Mjk2ZjFiOTk3MmRjIiwiaCI6Im11cm11cjY0In0=';

const CHAT_PREFIX = 'sm_local_msg_';
let chatPartnerCode = null;
let chatPartnerName = null;
let chatRoom        = null;
let chatPollTimer   = null;

function buildChatRoom(a, b) { return [a, b].sort().join('-'); }

function getChatMessages() {
  if (!chatRoom) return [];
  try { return JSON.parse(localStorage.getItem(CHAT_PREFIX + chatRoom) || '[]'); }
  catch { return []; }
}
function saveChatMessages(msgs) {
  if (!chatRoom) return;
  localStorage.setItem(CHAT_PREFIX + chatRoom, JSON.stringify(msgs));
}

function renderChatMessages() {
  const container = document.getElementById('chatMsgs');
  if (!container) return;
  const msgs = getChatMessages();
  if (!msgs.length) {
    container.innerHTML = `<div style="text-align:center;color:#64748b;font-size:0.85rem;padding:2rem 0;">💬 Noch keine Nachrichten.</div>`;
    return;
  }
  container.innerHTML = msgs.map(m => {
    const isMine = m.from === CODE;
    const time = new Date(m.ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    return `<div class="chat-bubble ${isMine ? 'mine' : 'theirs'}">
      ${!isMine ? `<span class="chat-bubble-author">${esc(m.fromName || chatPartnerName)}</span>` : ''}
      ${esc(m.text)}
      <div class="chat-bubble-time">${time}</div>
    </div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendChatMsg() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text || !chatPartnerCode) return;

  const myName = JSON.parse(localStorage.getItem('sm_profile_caching') || '{}').name || CODE;

  const msgs = getChatMessages();
  msgs.push({ from: CODE, fromName: myName, text, ts: Date.now() });
  saveChatMessages(msgs);
  input.value = '';
  renderChatMessages();

  try {
    await fetch(`${API}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: chatPartnerCode,
        sender_code: CODE,
        sender_name: myName,
        message: text,
        spot_type: 'caching_chat'
      })
    });
  } catch {}
}

function startChatPolling() {
  stopChatPolling();
  chatPollTimer = setInterval(async () => {
    if (!chatPartnerCode || !CODE) return;
    try {
      const r = await fetch(`${API}/messages/${CODE}?spot_type=caching_chat`);
      if (!r.ok) return;
      const newMsgs = await r.json();
      const fromPartner = newMsgs.filter(m => m.sender_code === chatPartnerCode);
      if (!fromPartner.length) return;

      const existing = getChatMessages();
      let hasNew = false;
      fromPartner.forEach(m => {
        const isDuplicate = existing.some(e =>
          e.from === m.sender_code && e.text === m.message &&
          Math.abs(e.ts - new Date(m.created_at).getTime()) < 5000
        );
        if (!isDuplicate) {
          existing.push({ from: m.sender_code, fromName: m.sender_name, text: m.message, ts: new Date(m.created_at).getTime() });
          hasNew = true;
        }
      });
      if (hasNew) { saveChatMessages(existing); renderChatMessages(); }
    } catch {}
  }, 4000);
}
function stopChatPolling() {
  if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
}

function openChatOverlay(partnerCode, partnerName) {
  if (!CODE) { showToast('⚠️ Bitte in der App anmelden'); return; }
  chatPartnerCode = partnerCode;
  chatPartnerName = partnerName || partnerCode;
  chatRoom        = buildChatRoom(CODE, partnerCode);

  document.getElementById('chatPartnerLabel').textContent = chatPartnerName;
  document.getElementById('chatOverlay').classList.add('active');
  renderChatMessages();
  startChatPolling();
}

function closeChatOverlay() {
  stopChatPolling();
  document.getElementById('chatOverlay').classList.remove('active');
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

function initMap(lat, lng) {
  if (spotMap) spotMap.remove();
  spotMap = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [lng, lat], zoom: 14,
    interactive: false, attributionControl: false
  });
  spotMap.on('load', () => {
    const el = document.createElement('div');
    el.style.cssText = 'width:22px;height:22px;background:#00e676;border-radius:50%;border:3px solid white;box-shadow:0 0 16px rgba(0,230,118,0.9);';
    new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(spotMap);
  });
}

async function loadSpot(id) {
  const content = document.getElementById('content');
  let spot;
  try {
    const r = await fetch(`${API}/live-spots/${id}`);
    if (!r.ok) throw new Error('not_found');
    spot = await r.json();
  } catch {
    content.innerHTML = `<div class="loading"><div class="loading-icon">🔍</div>Live Spot nicht gefunden.<br><a href="/" style="color:var(--acc);margin-top:1rem;display:block;">← Zur App</a></div>`;
    return;
  }

  if (spot.lat && spot.lng) initMap(+spot.lat, +spot.lng);

  // Follow-Status prüfen
  let isFollowing = false;
  if (CODE) {
    try {
      const fr = await fetch(`${API}/live-spots/following?code=${CODE}&token=${TOK}`);
      if (fr.ok) {
        const list = await fr.json();
        isFollowing = list.some(s => s.id === spot.id);
      }
    } catch {}
  }

  const online = spot.status === 'online';
  const EMOJI = { 'Park':'🌳','Restaurant':'🍽️','Strand':'🏖️','Café':'☕','Club':'🎉','Fitness':'💪','Natur':'🌿','Bahnhof':'🚉','Sonstiges':'📌' };
  const catIcon = EMOJI[spot.category] || '📡';

  const timeAgo = t => {
    const m = Math.round((Date.now()-new Date(t))/60000);
    if (m < 1) return 'Gerade eben';
    if (m < 60) return `vor ${m} Min`;
    if (m < 1440) return `vor ${Math.floor(m/60)}h`;
    return `vor ${Math.floor(m/1440)} Tagen`;
  };

  content.innerHTML = `
    <div class="profile-head">
      <div class="avatar">${spot.avatar?`<img src="${spot.avatar}" alt="">`:`${catIcon}`}</div>
      <div class="profile-info">
        <div class="profile-name">${esc(spot.name)}</div>
        <div class="profile-cat">${spot.category||'Live Spot'}</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
      <div class="status-badge ${online?'online':'offline'}">
        <div class="status-dot ${online?'pulse':''}"></div>
        ${online ? 'LIVE' : 'Offline'}
      </div>
      <span style="font-size:0.72rem;color:var(--muted2);">Aktualisiert ${timeAgo(spot.updated_at)}</span>
    </div>

    ${spot.description ? `
    <div class="info-card">
      <div class="info-label">ÜBER DIESEN SPOT</div>
      <div class="info-text">${esc(spot.description)}</div>
    </div>` : ''}

    ${online && spot.location_note ? `
    <div class="info-card">
      <div class="info-label">📍 AKTUELLER STANDORT</div>
      <div class="location-note">${esc(spot.location_note)}</div>
    </div>` : ''}

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val">👥 ${spot.follower_count}</div>
        <div class="stat-label">Follower</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" style="color:${online?'var(--green)':'var(--muted)'};">${online?'●':'○'}</div>
        <div class="stat-label">${online?'Live jetzt':'Offline'}</div>
      </div>
    </div>

    <div class="btn-row">
      ${CODE ? `<button class="btn btn-follow ${isFollowing?'following':''}" id="followBtn"
        onclick="toggleFollow(${spot.id})">
        ${isFollowing ? '✓ Gefolgt' : '+ Folgen'}
      </button>` : ''}
      ${online && spot.lat ? `<button class="btn btn-nav" onclick="navigate(${spot.lat},${spot.lng},'${esc(spot.name).replace(/'/g,"\\'")}')">🧭 Route</button>` : ''}
      ${CODE && spot.creator_code && spot.creator_code !== CODE ? `<button class="btn btn-nav" onclick="openChatOverlay('${spot.creator_code}','${esc(spot.name).replace(/'/g,"\\'")}')">💬 Chat</button>` : ''}
    </div>

    ${!CODE ? `<div style="font-size:0.78rem;color:var(--muted2);text-align:center;">
      <a href="/" style="color:var(--acc);">App öffnen</a> um zu folgen und Benachrichtigungen zu erhalten.
    </div>` : ''}
  `;
}

let currentlyFollowing = false;
async function toggleFollow(id) {
  if (!CODE) { showToast('⚠️ Bitte in der App anmelden'); return; }
  const btn = document.getElementById('followBtn');
  const following = btn.classList.contains('following');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/live-spots/${id}/follow`, {
      method: following ? 'DELETE' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOK })
    });
    if (r.ok) {
      btn.classList.toggle('following');
      btn.textContent = btn.classList.contains('following') ? '✓ Gefolgt' : '+ Folgen';
      showToast(btn.classList.contains('following') ? '✅ Du folgst jetzt!' : '🔕 Entfolgt');
    }
  } catch { showToast('⚠️ Verbindungsfehler'); }
  btn.disabled = false;
}

// ── NAVIGATION OVERLAY ─────────────────────────────────────────────────────
// 1:1 aus nav.js übernommen, direkt eingebettet — kein Page-Switch mehr

let naviMap          = null;
let naviUserMarker   = null;
let naviSpotMarker   = null;
let naviWatchId      = null;
let naviLastRoutePos = null;
let naviRouting      = false;
let naviTarget       = null;
let naviCentered     = true;

function navigate(lat, lng, name) {
  navigator.geolocation?.getCurrentPosition(pos => {
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    openNavOverlay(lat, lng, name);
  }, () => openNavOverlay(lat, lng, name), { enableHighAccuracy: true });
}

function openNavOverlay(lat, lng, name) {
  naviTarget = { lat, lng, name: name || 'Spot' };
  naviLastRoutePos = null;
  naviRouting = false;
  naviCentered = true;

  document.getElementById('naviSpotName').textContent = naviTarget.name;
  document.getElementById('naviSpotSub').textContent = 'NAVIGATION · GPS aktiv';
  document.getElementById('naviDistVal').textContent = '…';
  document.getElementById('naviFootVal').textContent = '…';
  document.getElementById('naviCarVal').textContent = '…';

  document.getElementById('naviOverlay').classList.add('active');

  document.getElementById('naviRecenterBtn').onclick = () => {
    naviCentered = true;
    if (naviMap && userPos) {
      naviMap.flyTo({ center: [userPos.lng, userPos.lat], zoom: 15, duration: 600 });
    }
  };

  setTimeout(() => {
    if (naviMap) { naviMap.remove(); naviMap = null; }
    naviUserMarker = null; naviSpotMarker = null;

    const center = userPos
      ? [(userPos.lng + lng) / 2, (userPos.lat + lat) / 2]
      : [lng, lat];

    naviMap = new maplibregl.Map({
      container: 'naviMap',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center, zoom: 14,
      attributionControl: false
    });

    naviMap.on('dragstart', () => { naviCentered = false; });

    naviMap.on('load', () => {
      const sEl = document.createElement('div');
      sEl.style.cssText = 'width:22px;height:22px;background:#ff9f00;border-radius:50%;border:2.5px solid rgba(255,255,255,0.85);box-shadow:0 0 0 4px rgba(255,159,0,0.2),0 0 20px rgba(255,159,0,0.8);';
      naviSpotMarker = new maplibregl.Marker({ element: sEl })
        .setLngLat([lng, lat]).addTo(naviMap);

      if (userPos) {
        naviAddUserMarker();
        naviUpdateDistDisplay();
        naviFitBounds();
        naviFetchRoute();
      }
    });

    if (navigator.geolocation) {
      naviWatchId = navigator.geolocation.watchPosition(pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };

        if (naviUserMarker) naviUserMarker.setLngLat([userPos.lng, userPos.lat]);
        else naviAddUserMarker();

        if (naviCentered && naviMap) {
          naviMap.easeTo({ center: [userPos.lng, userPos.lat], duration: 400 });
        }

        naviUpdateDistDisplay();

        const moved = naviLastRoutePos
          ? haversineKm(naviLastRoutePos.lat, naviLastRoutePos.lng, userPos.lat, userPos.lng) * 1000
          : 999;
        if (moved > 25) naviFetchRoute();

      }, () => showToast('⚠️ GPS Signal verloren'),
         { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    }
  }, 80);
}

function naviAddUserMarker() {
  if (!naviMap || !userPos) return;
  if (naviUserMarker) naviUserMarker.remove();
  const uEl = document.createElement('div');
  uEl.style.cssText = 'width:18px;height:18px;background:#22d3ee;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(34,211,238,0.9);';
  naviUserMarker = new maplibregl.Marker({ element: uEl })
    .setLngLat([userPos.lng, userPos.lat]).addTo(naviMap);
}

function naviFitBounds() {
  if (!naviMap || !userPos || !naviTarget) return;
  const bounds = new maplibregl.LngLatBounds(
    [userPos.lng, userPos.lat], [naviTarget.lng, naviTarget.lat]
  );
  naviMap.fitBounds(bounds, { padding: 80, maxZoom: 16 });
}

function naviUpdateDistDisplay() {
  if (!userPos || !naviTarget) return;
  const m = haversineKm(userPos.lat, userPos.lng, naviTarget.lat, naviTarget.lng) * 1000;
  document.getElementById('naviDistVal').textContent =
    m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
}

function naviClearRouteLayers() {
  if (!naviMap) return;
  ['navi-foot-casing','navi-foot','navi-car-casing','navi-car'].forEach(id => {
    if (naviMap.getLayer(id)) naviMap.removeLayer(id);
  });
  ['navi-src-foot','navi-src-car'].forEach(id => {
    if (naviMap.getSource(id)) naviMap.removeSource(id);
  });
}

async function naviFetchRoute() {
  if (!userPos || !naviTarget || !naviMap || naviRouting) return;
  naviRouting = true;
  naviLastRoutePos = { ...userPos };

  const start = `${userPos.lng},${userPos.lat}`;
  const end   = `${naviTarget.lng},${naviTarget.lat}`;

  const osrmBase = `${userPos.lng},${userPos.lat};${naviTarget.lng},${naviTarget.lat}?overview=full&geometries=geojson`;
  const carPromise = fetch(`https://router.project-osrm.org/route/v1/driving/${osrmBase}`)
    .then(r => r.json()).catch(() => null);

  const footPromise = ORS_KEY
    ? fetch(`https://api.openrouteservice.org/v2/directions/foot-hiking?api_key=${ORS_KEY}&start=${start}&end=${end}`)
        .then(r => r.json()).catch(() => null)
    : fetch(`https://router.project-osrm.org/route/v1/foot/${osrmBase}`)
        .then(r => r.json()).catch(() => null);

  const [carData, footRaw] = await Promise.all([carPromise, footPromise]);

  naviRouting = false;
  if (!naviMap) return;

  naviClearRouteLayers();

  const fmtMin = s => {
    const m = Math.round(s / 60);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };

  if (carData?.routes?.length) {
    const r = carData.routes[0];
    naviMap.addSource('navi-src-car', { type: 'geojson', data: { type: 'Feature', geometry: r.geometry } });
    naviMap.addLayer({ id: 'navi-car-casing', type: 'line', source: 'navi-src-car', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#0a0d12', 'line-width': 8, 'line-opacity': 0.7 } });
    naviMap.addLayer({ id: 'navi-car', type: 'line', source: 'navi-src-car', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#f59e0b', 'line-width': 5, 'line-opacity': 0.9 } });
    document.getElementById('naviCarVal').textContent = fmtMin(r.duration);
  }

  let footGeometry = null, footDuration = null;
  if (ORS_KEY && footRaw?.features?.length) {
    footGeometry = footRaw.features[0].geometry;
    footDuration  = footRaw.features[0].properties?.summary?.duration;
  } else if (!ORS_KEY && footRaw?.routes?.length) {
    footGeometry = footRaw.routes[0].geometry;
    footDuration  = footRaw.routes[0].duration;
  }

  if (footGeometry) {
    naviMap.addSource('navi-src-foot', { type: 'geojson', data: { type: 'Feature', geometry: footGeometry } });
    naviMap.addLayer({ id: 'navi-foot-casing', type: 'line', source: 'navi-src-foot', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#0a0d12', 'line-width': 6, 'line-opacity': 0.6 } });
    naviMap.addLayer({ id: 'navi-foot', type: 'line', source: 'navi-src-foot', layout: { 'line-join': 'round', 'line-cap': 'butt' }, paint: { 'line-color': '#22d3ee', 'line-width': 3, 'line-opacity': 1, 'line-dasharray': [2, 2] } });
    if (footDuration) document.getElementById('naviFootVal').textContent = fmtMin(footDuration);
  }
}

function closeNavOverlay() {
  if (naviWatchId) { navigator.geolocation.clearWatch(naviWatchId); naviWatchId = null; }
  if (naviMap) { naviMap.remove(); naviMap = null; }
  naviUserMarker = null; naviSpotMarker = null;
  naviLastRoutePos = null; naviTarget = null; naviRouting = false;
  document.getElementById('naviOverlay').classList.remove('active');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('naviOverlay').classList.contains('active')) {
    closeNavOverlay();
  }
});

const params = new URLSearchParams(window.location.search);
const id = params.get('id') || params.get('token');
if (id) loadSpot(id);
</script>
