<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SpotMe · WayPoint Creator</title>
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0a0d12; --card:#111720; --card2:#141e2a;
  --bord:rgba(255,255,255,0.07); --bord2:rgba(255,255,255,0.12);
  --txt:#e2e8f0; --muted:#94a3b8; --muted2:#64748b;
  --acc:#f59e0b; --acc-dim:rgba(245,158,11,0.12); --acc-glow:rgba(245,158,11,0.35);
  --cyan:#22d3ee; --green:#10b981; --red:#ef4444;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Outfit',sans-serif;overflow:hidden}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* ── HEADER ── */
.wp-header{
  display:flex;align-items:center;gap:0.6rem;
  padding:0.8rem 1rem; background:var(--card);
  border-bottom:1px solid var(--bord); flex-shrink:0;
}
.wp-logo{font-family:'Space Mono',monospace;font-size:0.85rem;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:6px}
.wp-logo-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);}
.wp-back-btn{padding:6px 12px;border-radius:40px;background:var(--card2);border:1px solid var(--bord2);color:var(--muted);font-size:0.78rem;font-family:'Outfit',sans-serif;cursor:pointer;margin-left:auto}

/* ── GPX IMPORT BAR ── */
.gpx-import-area{
  padding:0.5rem 1rem; background:var(--card2);
  border-bottom:1px solid var(--bord); display:flex; gap:0.5rem; align-items:center; flex-shrink:0;
}
.gpx-import-area label{flex:1;text-align:center;padding:0.45rem 0.8rem;border-radius:10px;background:var(--cyan-dim);border:1px solid var(--cyan-glow);color:var(--cyan);font-size:0.8rem;font-weight:700;cursor:pointer;}
.gpx-import-area span{font-size:0.7rem;color:var(--muted2);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── KARTE ── */
#map{flex:1;position:relative}

/* ── UNTERES PANEL (STEUERUNG) ── */
.control-panel{
  background:var(--card);border-top:1px solid var(--bord2);
  padding:0.85rem 1rem; padding-bottom:max(0.85rem, env(safe-area-inset-bottom));
  flex-shrink:0;
}
.status-row{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted2);font-family:'Space Mono',monospace;margin-bottom:0.75rem}
.status-row span strong{color:var(--cyan)}

.input-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem}
.input-group label{font-size:0.7rem;font-weight:600;color:var(--muted)}
.input-group input{width:100%;padding:0.65rem;border-radius:10px;background:var(--bg);border:1px solid var(--bord2);color:var(--txt);font-family:'Outfit',sans-serif;font-size:0.9rem;outline:none}
.input-group input:focus{border-color:var(--acc-glow)}

.button-row{display:flex;gap:0.5rem}
.btn-primary{flex:1;padding:0.75rem;border-radius:12px;background:var(--acc);color:#0a0d12;font-family:'Outfit',sans-serif;font-weight:700;border:none;cursor:pointer}
.btn-primary:active{opacity:0.8}
.btn-secondary{flex:1;padding:0.75rem;border-radius:12px;background:var(--cyan-dim);border:1px solid var(--cyan-glow);color:var(--cyan);font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer}
.btn-danger{flex:1;padding:0.75rem;border-radius:12px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer}

/* ── TOAST ── */
.toast{position:fixed;bottom:max(2rem, env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(15px);background:var(--card2);backdrop-filter:blur(10px);border:1px solid var(--bord2);border-radius:100px;padding:0.5rem 1.2rem;font-size:0.82rem;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── USER & WP MARKER ── */
.user-dot{width:16px;height:16px;background:var(--cyan);border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(34,211,238,0.8)}
.wp-dot{width:22px;height:22px;background:var(--acc);border-radius:50%;border:2px solid white;box-shadow:0 0 12px rgba(245,158,11,0.8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.6rem;color:#0a0d12}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="wp-header">
    <div class="wp-logo"><div class="wp-logo-dot"></div>CREATOR</div>
    <div style="font-size:0.8rem;color:var(--muted2);font-family:'Space Mono',monospace;">Physikalischer Recorder</div>
    <button class="wp-back-btn" onclick="location.href='/'">← App</button>
  </div>

  <!-- GPX Import Bar -->
  <div class="gpx-import-area">
    <label for="gpxFileInput">📂 GPX importieren</label>
    <input type="file" id="gpxFileInput" accept=".gpx" style="display:none;" onchange="importGPX(this)">
    <span id="gpxStatus">Keine Datei geladen</span>
  </div>

  <!-- Karte -->
  <div id="map"></div>

  <!-- Steuerungspanel -->
  <div class="control-panel">
    <div class="status-row">
      <span>📍 Gespeichert: <strong id="wpCount">0</strong></span>
      <span>🛰️ GPS: <strong id="gpsStatus">Suche...</strong></span>
    </div>

    <div class="input-group">
      <label for="wpName">Wie heißt dieser WayPoint / Frage?</label>
      <input type="text" id="wpName" placeholder="z.B. Aussichtspunkt an der Brücke" maxlength="120">
    </div>

    <div class="button-row">
      <button class="btn-primary" id="saveBtn" disabled>📍 Hier speichern</button>
      <button class="btn-secondary" id="exportBtn">📥 Export JSON</button>
      <button class="btn-danger" id="resetBtn">🗑️ Zurücksetzen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
<script>
'use strict';

// ── STATE ────────────────────────────────────────────────────────────────────
let map, userMarker, userPos = null;
let waypoints = []; // Speichert { lat, lng, question, description }
let watchId = null;
let wpMarkers = [];

// GPX Metadaten
let trackName = 'Aufgenommene Route';
let trackDesc = 'Per GPS erstellte Route';

let toastTimer;

// ── KARTE INIT ──────────────────────────────────────────────────────────────
function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-0.38, 39.47], 
    zoom: 15,
    attributionControl: false
  });

  map.on('load', () => {
    startGPS();
  });
}

// ── GPS / STANDORT ──────────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) { 
    document.getElementById('gpsStatus').textContent = '❌ Kein GPS'; 
    return; 
  }

  const statusEl = document.getElementById('gpsStatus');
  const saveBtn = document.getElementById('saveBtn');

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      userPos = { 
        lat: pos.coords.latitude, 
        lng: pos.coords.longitude 
      };

      statusEl.textContent = '✅ Aktiv';
      statusEl.style.color = 'var(--green)';
      saveBtn.disabled = false;

      if (userMarker) {
        userMarker.setLngLat([userPos.lng, userPos.lat]);
      } else {
        addUserMarker(); 
        // Erstes Mal auf Nutzer zentrieren
        if (waypoints.length === 0 && map) {
          map.flyTo({ 
            center: [userPos.lng, userPos.lat], 
            zoom: 17, 
            duration: 1500 
          });
        }
      }
    },
    (err) => {
      statusEl.textContent = '⚠️ Signal verloren';
      statusEl.style.color = 'var(--red)';
      saveBtn.disabled = true;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function addUserMarker() {
  const el = document.createElement('div');
  el.className = 'user-dot';
  userMarker = new maplibregl.Marker({ element: el })
    .setLngLat([userPos.lng, userPos.lat])
    .addTo(map);
}

// ── WAYPOINT SPEICHERN ───────────────────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', () => {
  if (!userPos) { toast('❌ Kein GPS-Signal'); return; }

  const nameInput = document.getElementById('wpName');
  const name = nameInput.value.trim() || `WayPoint ${waypoints.length + 1}`;

  const newWp = { 
    lat: userPos.lat, 
    lng: userPos.lng, 
    question: name,
    description: '' // Manuell hinzugefügte Punkte haben erstmal keine Beschreibung
  };
  waypoints.push(newWp);

  document.getElementById('wpCount').textContent = waypoints.length;
  nameInput.value = '';
  toast(`📍 WayPoint ${waypoints.length} gespeichert!`);
  addWpMarker(newWp, waypoints.length);
});

function addWpMarker(wp, index) {
  const el = document.createElement('div');
  el.className = 'wp-dot';
  el.textContent = index;
  
  const marker = new maplibregl.Marker({ element: el })
    .setLngLat([wp.lng, wp.lat])
    .addTo(map);
  wpMarkers.push(marker);

  map.flyTo({ center: [wp.lng, wp.lat], zoom: 17, duration: 1000 });
}

// ── GPX IMPORT ──────────────────────────────────────────────────────────────
function importGPX(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const xmlText = e.target.result;
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");

    // Route zurücksetzen
    waypoints = [];
    wpMarkers.forEach(m => m.remove());
    wpMarkers = [];
    document.getElementById('wpCount').textContent = '0';

    // GPX Header (Track-Name und Beschreibung) auslesen
    const trkEl = xmlDoc.getElementsByTagName('trk')[0];
    if (trkEl) {
      const trkName = trkEl.getElementsByTagName('name')[0]?.textContent;
      const trkDesc = trkEl.getElementsByTagName('desc')[0]?.textContent;
      if (trkName) trackName = trkName.trim();
      if (trkDesc) trackDesc = trkDesc.trim();
    }

    // WayPoints (WPT) auslesen
    const wptElements = xmlDoc.getElementsByTagName('wpt');
    if (wptElements.length === 0) {
      toast('⚠️ Keine WayPoints (<wpt>) in der GPX-Datei gefunden!');
      return;
    }

    let index = 1;
    for (let wpt of wptElements) {
      const lat = parseFloat(wpt.getAttribute('lat'));
      const lng = parseFloat(wpt.getAttribute('lon'));
      
      const rawName = wpt.getElementsByTagName('name')[0]?.textContent || '';
      const rawDesc = wpt.getElementsByTagName('desc')[0]?.textContent || '';
      
      const question = rawName.trim() || `WayPoint ${index}`;
      const description = rawDesc.trim() || '';
      
      const newWp = { lat, lng, question, description };
      waypoints.push(newWp);
      addWpMarker(newWp, index);
      index++;
    }

    document.getElementById('wpCount').textContent = waypoints.length;
    document.getElementById('gpxStatus').textContent = `✅ ${waypoints.length} WayPoints importiert`;
    toast(`📍 ${waypoints.length} WayPoints aus GPX geladen!`);

    // Track-Linie zeichnen
    const trkSegments = xmlDoc.getElementsByTagName('trkseg');
    if (trkSegments.length > 0) {
      const routeCoords = [];
      const points = trkSegments[0].getElementsByTagName('trkpt');
      for (let p of points) {
        const lat = parseFloat(p.getAttribute('lat'));
        const lng = parseFloat(p.getAttribute('lon'));
        routeCoords.push([lng, lat]);
      }

      if (map.getSource('gpxTrack')) map.removeSource('gpxTrack');
      if (map.getLayer('gpxTrackLine')) map.removeLayer('gpxTrackLine');

      map.addSource('gpxTrack', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: routeCoords }
        }
      });
      map.addLayer({
        id: 'gpxTrackLine',
        type: 'line',
        source: 'gpxTrack',
        paint: { 'line-color': '#22d3ee', 'line-width': 3, 'line-dasharray': [5, 3] }
      });

      if (routeCoords.length > 0) {
        map.fitBounds(new maplibregl.LngLatBounds(routeCoords), { padding: 50 });
      }
    }

    input.value = '';
  };
  reader.readAsText(file);
}

// ── EXPORT JSON ──────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  if (waypoints.length === 0) { toast('⚠️ Noch keine WayPoints gespeichert'); return; }

  const data = {
    name: trackName,
    description: trackDesc,
    difficulty: 1,
    waypoints: waypoints.map((wp, i) => ({
      order_index: i,
      lat: wp.lat,
      lng: wp.lng,
      question: wp.question,      // Jetzt korrekt übernommen
      description: wp.description, // Jetzt korrekt übernommen
      option_a: "Option A",
      option_b: "Option B",
      option_c: "Option C",
      correct_option: "a"
    }))
  };

  const jsonString = JSON.stringify(data, null, 2);
  const blob = new Blob([jsonString], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `spotme_route_${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast(`✅ ${waypoints.length} WayPoints exportiert!`);
});

// ── RESET ────────────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  if (waypoints.length === 0) return;
  if (!confirm('Willst du wirklich alle gespeicherten Punkte löschen?')) return;
  
  waypoints = [];
  wpMarkers.forEach(m => m.remove());
  wpMarkers = [];
  document.getElementById('wpCount').textContent = '0';
  toast('🗑️ Route zurückgesetzt');
});

// ── TOAST HELPER ─────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── START ──────────────────────────────────────────────────────────────────
initMap();
</script>
</body>
</html>
