<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SpotMe UI Template</title>
  
  <!-- Deine Theme-Variablen (referenziert auf deine bestehende Datei) -->
  <link rel="stylesheet" href="theme-vars.css">
  
  <!-- Icons (Lucide) für das Template -->
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>

  <style>
    /* ── Basis Reset ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    /* ── Karten-Platzhalter (Dark Mode Wireframe) ── */
    #map-placeholder {
      position: absolute; inset: 0; z-index: 1;
      /* Dunkler Hintergrund wie eine Karte */
      background: #0b1118;
      background-image: 
        /* Stilisierte Straßen-Linien als Raster */
        linear-gradient(#1a2533 1px, transparent 1px),
        linear-gradient(90deg, #1a2533 1px, transparent 1px);
      background-size: 60px 60px;
      /* Zusätzliche "Stadt"-Kreise als Deko */
      background-image: 
        radial-gradient(circle at 30% 50%, rgba(0, 229, 255, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 70% 30%, rgba(255, 159, 0, 0.02) 0%, transparent 50%),
        linear-gradient(#1a2533 1px, transparent 1px),
        linear-gradient(90deg, #1a2533 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
    }
    :root[data-theme="light"] #map-placeholder {
      background: #f2f2f2;
      background-image: 
        radial-gradient(circle at 30% 50%, rgba(0, 0, 0, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 70% 30%, rgba(0, 0, 0, 0.02) 0%, transparent 50%),
        linear-gradient(#cccccc 1px, transparent 1px),
        linear-gradient(90deg, #cccccc 1px, transparent 1px);
    }

    /* ── UI ÜBERLAGERUNG ── */
    #ui-overlay {
      position: absolute; inset: 0; z-index: 10;
      pointer-events: none; /* Klick geht standardmäßig durch */
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 
               max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    #ui-overlay button { pointer-events: auto; cursor: pointer; transition: transform 0.15s; }
    #ui-overlay button:active { transform: scale(0.92); }

    /* ── GLASSMORPHISMUS ── */
    .glass {
      background: rgba(10, 13, 18, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    :root[data-theme="light"] .glass {
      background: rgba(244, 246, 248, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* ── TOP LEFT ── */
    .top-left-ui {
      position: absolute; top: 20px; left: 20px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem;
    }
    .menu-btn {
      background: transparent; border: none; padding: 0;
    }
    .logo-glow {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--acc);
      box-shadow: 0 0 12px var(--acc), 0 0 24px rgba(255,159,0,0.4);
    }
    .status-pill {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.35rem 0.9rem; border-radius: 100px;
      font-size: 0.7rem; font-weight: 600; color: var(--muted);
      font-family: 'Outfit', sans-serif;
    }
    .status-pill strong { color: #fff; font-weight: 700; }
    .status-pill .separator { width: 1px; height: 12px; background: rgba(255,255,255,0.15); }
    :root[data-theme="light"] .status-pill strong { color: #1a2530; }

    /* ── TOP RIGHT ── */
    .top-right-ui {
      position: absolute; top: 20px; right: 20px;
      display: flex; align-items: center; gap: 1.2rem;
      padding: 0.45rem 1rem; border-radius: 100px;
    }
    .top-right-ui .icon-btn {
      background: transparent; border: none; color: #fff; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .top-right-ui .icon-btn svg { width: 20px; height: 20px; stroke-width: 1.8; }
    :root[data-theme="light"] .top-right-ui .icon-btn { color: #1a2530; }

    /* ── FAB (Unten Rechts) ── */
    .fab-main {
      position: absolute; bottom: 110px; right: 20px;
      width: 64px; height: 64px; border-radius: 18px;
      background: var(--acc);
      border: none;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(255, 159, 0, 0.5);
    }
    .fab-main svg { width: 28px; height: 28px; stroke-width: 2.5; }

    /* ── BOTTOM DOCK ── */
.bottom-dock {
  position: absolute;
  bottom: max(1.2rem, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  padding: 0.55rem 0.8rem;  /* Etwas mehr Polsterung innen */
  border-radius: 28px;
  gap: 0.15rem; /* Die Lücken zwischen den Buttons minimieren */
  pointer-events: auto;
  width: auto;
  min-width: 60%;
  max-width: 340px;
  justify-content: space-around;
}

.dock-item {
  flex: 1;
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px; /* Weniger Abstand zwischen Icon und Text */
  padding: 0.4rem 0.2rem;
  color: var(--muted2);
  font-size: 0.65rem; /* Schrift etwas kompakter */
  font-weight: 600;
  font-family: 'Outfit', sans-serif;
  transition: color 0.2s, transform 0.2s;
  border-radius: 12px;
}

/* Das Icon selbst verkleinern */
.dock-item svg {
  width: 22px;
  height: 22px;
  stroke-width: 1.8;
  transition: transform 0.2s, filter 0.2s;
}

/* ── AKTIVER ZUSTAND (Highlight) ── */
.dock-item.active {
  color: #fff;
}
.dock-item.active svg {
  transform: scale(1.05);
  /* Der subtile Cyan-Glow um das aktive Icon (wie im KI-Bild) */
  filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.4)); 
}

/* Light Mode Anpassungen für den aktiven Zustand */
:root[data-theme="light"] .dock-item.active {
  color: #1a2530;
}
:root[data-theme="light"] .dock-item.active svg {
  filter: drop-shadow(0 0 6px rgba(14, 165, 196, 0.4));
}
    
    /* ── THEME SWITCH ZUM TESTEN ── */
    .test-controls {
      position: absolute; bottom: 120px; left: 20px; z-index: 20;
      pointer-events: auto;
    }
    .test-controls button {
      background: var(--card); border: 1px solid var(--bord2); color: var(--text);
      padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <!-- 1. Karten-Hintergrund (Platzhalter) -->
  <div id="map-placeholder"></div>

  <!-- 2. UI Overlay -->
  <div id="ui-overlay">
    
    <!-- Top Left: Logo & Status -->
    <div class="top-left-ui">
      <button class="menu-btn" title="Menü">
        <div class="logo-glow"></div>
      </button>
      <div class="status-pill glass">
        <span>SPOTS <strong>1</strong></span>
        <span class="separator"></span>
        <span>INVITES <strong>0</strong></span>
      </div>
    </div>

    <!-- Top Right: Controls -->
    <div class="top-right-ui glass">
      <button class="icon-btn" title="Zentrieren"><i data-lucide="scan"></i></button>
      <button class="icon-btn" title="Ebenen"><i data-lucide="layers"></i></button>
      <button class="icon-btn" title="Neu laden"><i data-lucide="refresh-ccw"></i></button>
    </div>

    <!-- FAB: Hauptaktion -->
    <button class="fab-main" title="Spot setzen">
      <i data-lucide="map-pin" style="color:#ef4444;"></i>
    </button>

    <!-- Bottom Dock: Navigation -->
    <div class="bottom-dock glass">
      <button class="dock-item active">
        <i data-lucide="map-pin"></i>
        <span>Meine Spots</span>
      </button>
      <button class="dock-item">
        <i data-lucide="compass"></i>
        <span>Entdecken</span>
      </button>
      <button class="dock-item">
        <i data-lucide="plus-circle"></i>
        <span>Erstellen</span>
      </button>
    </div>

    <!-- Test-Controls (Dunkel/Hell) -->
    <div class="test-controls">
      <button onclick="document.documentElement.setAttribute('data-theme', 'dark')">🌙 Dunkel</button>
      <button onclick="document.documentElement.setAttribute('data-theme', 'light')">☀️ Hell</button>
    </div>
  </div>

  <!-- Icons initialisieren -->
  <script>lucide.createIcons();</script>
</body>
</html>
