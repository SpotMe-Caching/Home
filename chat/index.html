<!DOCTYPE html>
<html lang="de">
<head>

  <!-- Eruda – Mobile Console (nur für Debugging) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotMe Chat</title>
  <link rel="manifest" href="/chat/manifest.json">
  <meta name="theme-color" content="#0a0d12">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, #0a0d12 0%, #1a1f26 100%);
    color: #e0e0e0;
    height: 100vh;
    overflow: hidden;
  }
  
  /* Login Screen */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 2rem;
  }
  #loginScreen .logo { font-size: 3rem; margin-bottom: 1rem; }
  #loginScreen h1 { margin-bottom: 0.5rem; color: #ff4f7b; }
  #loginScreen .subtitle { color: var(--muted2); margin-bottom: 2rem; }
  #loginScreen input {
    width: 100%; max-width: 280px;
    padding: 0.85rem; margin-bottom: 0.75rem;
    border: 1px solid #333; border-radius: 10px;
    background: #1a1f26; color: #fff;
    font-size: 1rem; text-align: center;
  }
  #loginScreen button {
    width: 100%; max-width: 280px;
    padding: 0.85rem; margin-top: 1rem;
    background: #ff4f7b; border: none;
    border-radius: 10px; font-weight: 600;
    color: #fff; cursor: pointer;
  }
  
  /* Chat List */
  #chatListScreen { display: none; height: 100vh; }
  .chat-list-header {
    padding: 1rem; background: #0f1218;
    border-bottom: 1px solid var(--bord);
  }
  .chat-list { overflow-y: auto; height: calc(100vh - 60px); }
  .chat-item {
    padding: 1rem; border-bottom: 1px solid #222;
    display: flex; align-items: center; gap: 1rem;
    cursor: pointer; position: relative;
  }
  .chat-item:hover { background: #15181e; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #ff4f7b, #ff9f00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; margin-bottom: 0.2rem; }
  .chat-preview {
    font-size: 0.85rem; color: var(--muted2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-meta { text-align: right; min-width: 70px; flex-shrink: 0; }
  .chat-time { font-size: 0.75rem; color: var(--muted); }
  .unread-badge {
    background: #ff4f7b; color: #fff;
    font-size: 0.7rem; padding: 2px 8px;
    border-radius: 10px; margin-top: 5px;
    display: inline-block;
  }
  
  /* Chat Detail */
  #chatDetailScreen { display: none; flex-direction: column; height: 100vh; }
  .chat-header {
    padding: 1rem; background: #0f1218;
    border-bottom: 1px solid var(--bord);
    display: flex; align-items: center; gap: 1rem;
  }
  .back-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
  .header-info { flex: 1; }
  .header-name { font-weight: 600; margin-bottom: 0.3rem; }
  .header-status { font-size: 0.8rem; }
  
  /* P2P Indikator */
  .p2p-indicator {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 500;
  }
  .p2p-dot {
    width: 8px; height: 8px; border-radius: 50%;
    animation: pulse 2s infinite;
  }
  .p2p-active .p2p-dot { background: #4ade80; }
  .p2p-active { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
  .p2p-inactive .p2p-dot { background: #6b7280; animation: none; }
  .p2p-inactive { background: rgba(107, 114, 128, 0.15); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.3); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.9); }
  }
  
  /* P2P Banner */
  .p2p-banner {
    display: none;
    padding: 0.75rem 1rem;
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(34, 197, 94, 0.05));
    border-bottom: 1px solid rgba(74, 222, 128, 0.2);
    font-size: 0.8rem; color: #4ade80;
    text-align: center;
  }
  .p2p-banner.show { display: block; }
  
  .messages-container {
    flex: 1; overflow-y: auto; padding: 1rem;
    background: #0a0d12;
  }
  .message {
    max-width: 75%; padding: 0.6rem 0.9rem;
    border-radius: 12px; margin-bottom: 0.5rem;
    word-wrap: break-word; position: relative;
  }
  .message.mine {
    align-self: flex-end; margin-left: auto;
    background: linear-gradient(135deg, #ff4f7b, #ff9f00);
  }
  .message.other { align-self: flex-start; background: #1a1f26; }
  .msg-author {
    font-size: 0.7rem; color: #aaa; margin-bottom: 0.2rem;
  }
  .message.mine .msg-author { display: none; }
  .msg-time {
    font-size: 0.65rem; color: #888;
    margin-top: 0.2rem; text-align: right;
  }
  
  /* Input Bar */
  .input-bar {
    padding: 0.75rem 1rem; background: #0f1218;
    border-top: 1px solid var(--bord);
    display: flex; gap: 0.5rem;
  }
  .input-bar input {
    flex: 1; padding: 0.7rem; border-radius: 20px;
    border: 1px solid #333; background: #1a1f26;
    color: #fff; font-size: 1rem;
  }
  .input-bar button {
    width: 48px; height: 48px; border-radius: 50%;
    background: #ff4f7b; border: none;
    color: #fff; font-size: 1.2rem; cursor: pointer;
  }
  
  /* Connection Status Footer */
  .connection-status {
    padding: 0.5rem 1rem; font-size: 0.75rem;
    border-top: 1px solid #222; text-align: center;
    color: var(--muted);
  }
  .connection-status.p2p { color: #4ade80; }
  .connection-status.server { color: #fb923c; }
  
  /* Helpers */
  .hidden { display: none !important; }
  .text-center { text-align: center; }
  .error { color: #ff4f7b; margin-top: 1rem; }
  .success { color: #4ade80; margin-top: 1rem; font-size: 0.85rem; }
</style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="logo">💬</div>
    <h1>SpotMe Chat</h1>
    <p class="subtitle">Eigenständiger Messenger mit P2P</p>
    <input type="text" id="loginCode" maxlength="6" placeholder="6-stelliger Code">
    <input type="password" id="loginToken" placeholder="Token (optional)">
    <button onclick="handleLogin()">Anmelden</button>
    <p id="loginError" class="error"></p>
    <a href="/" style="margin-top:1rem; color:#ff4f7b; font-size:0.85rem;">← Zurück zu SpotME Caching</a>
  </div>

  <!-- Chat List -->
  <div id="chatListScreen">
    <div class="chat-list-header">
      <h2>💬 Chats</h2>
      <button class="logout-btn" onclick="handleLogout()" style="float:right;background:none;border:none;color:#ff4f7b;cursor:pointer;font-size:0.85rem;">Abmelden</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </div>

<!-- Chat Detail -->
<div id="chatDetailScreen">
  <!-- P2P Banner -->
  <div id="p2pBanner" class="p2p-banner">
    <span class="icon">🔒</span> 
    <span id="p2pBannerText">Direct P2P Connection - Deine Nachrichten sind privat!</span>
  </div>
  
  <div class="chat-header">
    <button class="back-btn" onclick="goBackToList()">←</button>
    <div class="header-info">
      <div class="header-name" id="headerName">...</div>
      <div class="header-status" id="headerStatus">
        <span class="p2p-indicator p2p-inactive" id="p2pIndicator">
          <span class="p2p-dot"></span>
          <span id="p2pStatusText">Offline</span>
        </span>
      </div>
    </div>
  </div>
  
  <div id="messages" class="messages-container"></div>
  
  <!-- Connection Status Footer -->
  <div id="connectionStatus" class="connection-status server">
    Verbindungsmodus prüfen...
  </div>
  
  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ── GLOBAL VARIABLES ───────────────────────────────────────────────────────
const API = 'https://spotme-chat-obom.onrender.com/api';

let CODE = null, TOKEN = null, PROFILE = null;
let CURRENT_ROOM = null, PARTNER_CODE = null, PARTNER_NAME = null;
let POLL_TIMER = null;
const CHAT_PREFIX = 'sm_local_msg_';

// WebRTC / P2P Status
let webrtc = null;
let isP2PConnected = false;
let p2pConnectionTime = null;

// ── AUTH ──────────────────────────────────────────────────────────────────
async function handleLogin() {
  const code = document.getElementById('loginCode').value.trim();
  const token = document.getElementById('loginToken').value.trim();
  
  if (!code || code.length !== 6) {
    document.getElementById('loginError').textContent = 'Bitte 6-stelligen Code eingeben';
    return;
  }
  
  try {
    // Profil beim Server prüfen
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['x-spotme-token'] = token;
    
    const res = await fetch(`${API}/profile/${code}?spot=caching`, { headers });
    if (!res.ok) {
      throw new Error('Profil nicht gefunden oder ungültiger Token');
    }
    
    const profile = await res.json();
    
    CODE = code;
    TOKEN = token;
    PROFILE = profile;
    
    // localStorage persistieren (im chat Namespace)
    localStorage.setItem('sm_chat_code', code);
    if (token) localStorage.setItem('sm_chat_token', token);
    localStorage.setItem('sm_chat_profile', JSON.stringify(profile));
    
    // UI umschalten
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatListScreen').style.display = 'block';
    
    // WebRTC initialisieren (PeerJS Setup)
    initWebRTC();
    
    // Polling für Server-Nachrichten starten
    initPolling();
    
    // Chat Liste rendern
    renderChatList();

  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

function handleLogout() {
  // Cleanup WebRTC Verbindung
  if (webrtc) {
    webrtc.destroy();
    webrtc = null;
  }
  isP2PConnected = false;
  p2pConnectionTime = null;
  
  // Cleanup Polling
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = null;
  
  // localStorage bereinigen
  localStorage.removeItem('sm_chat_code');
  localStorage.removeItem('sm_chat_token');
  localStorage.removeItem('sm_chat_profile');
  
  // Reset globals
  CODE = null; TOKEN = null; PROFILE = null;
  CURRENT_ROOM = null; PARTNER_CODE = null; PARTNER_NAME = null;
  
  // UI zurücksetzen
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginCode').value = '';
  document.getElementById('loginToken').value = '';
  document.getElementById('loginError').textContent = '';
  
  // P2P UI resetten
  const connStatus = document.getElementById('connectionStatus');
  if (connStatus) {
    connStatus.className = 'connection-status server';
    connStatus.innerHTML = 'Verbindungsmodus prüfen...';
  }
  }

// Autologin versuchen wenn gespeichert
async function autoLogin() {
  const savedCode = localStorage.getItem('sm_chat_code');
  const savedToken = localStorage.getItem('sm_chat_token');
  
  if (!savedCode) return false;
  
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (savedToken) headers['x-spotme-token'] = savedToken;
    
    const res = await fetch(`${API}/profile/${savedCode}?spot=caching`, { headers });
    if (res.ok) {
      CODE = savedCode;
      TOKEN = savedToken;
      PROFILE = await res.json();
      
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('chatListScreen').style.display = 'block';
      
      initWebRTC();
      initPolling();
      renderChatList();
      return true;
    }
  } catch (e) {
    console.error('Autologin failed:', e);
  }
  return false;
}

// ── WEBRTC / P2P SETUP ────────────────────────────────────────────────────
function initWebRTC() {
  const script = document.createElement('script');
  script.type = 'module';
  script.src = 'webrtc.js';
  
  script.onload = () => {
    console.log('[WebRTC] Script geladen');
    
    import('./webrtc.js').then(module => {
      const SpotMeWebRTC = module.default;
      
      if (SpotMeWebRTC) {
        webrtc = new SpotMeWebRTC(CODE, TOKEN);
        
        webrtc.onConnect = () => {
          console.log('[Chat] P2P Verbindung hergestellt');
          isP2PConnected = true;
          p2pConnectionTime = new Date();
          updateP2PUI(true, 'P2P Aktiv');
        };
        
        webrtc.onMessage = (msg) => {
          console.log('[Chat] P2P Message received:', msg);
          const msgs = getMessages();
          msgs.push(msg);
          saveMessages(msgs);
          renderMessages();
          renderChatList();
        };
        
        webrtc.onDisconnect = () => {
          console.log('[Chat] P2P Verbindung getrennt');
          isP2PConnected = false;
          p2pConnectionTime = null;
          updateP2PUI(false, 'Verbindung getrennt');
        };
        
        webrtc.onError = (err) => {
          console.error('[Chat] WebRTC Error:', err);
          updateP2PUI(false, 'Fehler');
        };
      }
    }).catch(err => {
      console.error('[WebRTC] Failed to import:', err);
    });
  };
  
  script.onerror = (err) => {
    console.error('[WebRTC] Failed to load webrtc.js:', err);
  };
  
  document.head.appendChild(script);
  }

// ── CHAT LIST ─────────────────────────────────────────────────────────────
async function renderChatList() {
  const container = document.getElementById('chatList');
  if (!CODE) { 
    container.innerHTML = '<p class="text-center" style="padding:2rem;color:var(--muted2);">Keine Chats</p>'; 
    return; 
  }
  
  // Alle Chats aus localStorage finden
  const chats = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith(CHAT_PREFIX)) continue;
    
    const room = key.replace(CHAT_PREFIX, '');
    const codes = room.split('-');
    if (!codes.includes(CODE)) continue;
    
    const partnerCode = codes.find(c => c !== CODE);
    if (!partnerCode) continue;
    
    let msgs = [];
    try { msgs = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
    if (!msgs.length) continue;
    
    const lastMsg = msgs[msgs.length - 1];
    const time = new Date(lastMsg.ts);
    const timeStr = time.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const preview = lastMsg.text.length > 30 ? lastMsg.text.slice(0, 30) + '…' : lastMsg.text;
    
    chats.push({
      room, partnerCode, partnerName: lastMsg.fromName || partnerCode,
      lastText: preview, lastTs: lastMsg.ts, timeStr, unread: 0
    });
  }
  
  chats.sort((a, b) => b.lastTs - a.lastTs);
  
  container.innerHTML = chats.map(chat => `
    <div class="chat-item" onclick="openChat('${chat.room}', '${chat.partnerCode}', '${chat.partnerName}')">
      <div class="avatar">${(chat.partnerName[0] || '?').toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(chat.partnerName)}</div>
        <div class="chat-preview">${chat.lastTs === Date.now() ? '🟢 Online' : escapeHtml(chat.lastText)}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${chat.timeStr}</div>
        ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
      </div>
    </div>
  `).join('') || '<p class="text-center" style="padding:2rem;color:var(--muted2);">Noch keine Chats</p>';
}

// ── OPEN CHAT & P2P CONNECTION ────────────────────────────────────────────
async function openChat(room, partnerCode, partnerName) {
  CURRENT_ROOM = room;
  PARTNER_CODE = partnerCode;
  PARTNER_NAME = partnerName;
  
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'flex';
  
  document.getElementById('headerName').textContent = partnerName;
  updateP2PUI(false, 'Verbinde...');  // ← Hier geändert
  
  renderMessages();
  await attemptP2PConnection(partnerCode);
  }

async function attemptP2PConnection(partnerCode) {
  if (!webrtc) {
    console.warn('[Chat] WebRTC nicht initialisiert');
    updateP2PUI('Offline', false);
    return;
  }
  
  try {
    // 1. Erst "Bereit"-Einladung senden (Signal zum Server)
    await sendReadinessInvite(partnerCode);
    
    // 2. Peer-Connection starten
    await webrtc.connect(partnerCode, (peerId) => {
      console.log('[Chat] Peer ready:', peerId);
    });
    
    // 3. Verbindung initiieren (Peer kommt auf uns zu durch send() in initiateConnection)
    webrtc.initiateConnection(partnerCode);
    
    // Timeout: Nach 15 Sek noch keinen P2P → Server Fallback anzeigen
    setTimeout(() => {
      if (!isP2PConnected) {
        console.log('[Chat] P2P Timeout, bleibe im Server-Modus');
      }
    }, 15000);
    
  } catch (err) {
    console.error('[Chat] P2P Verbindung fehlgeschlagen:', err);
    updateP2PUI('Fallback: Server-Modus', false);
  }
}

async function sendReadinessInvite(partnerCode) {
  try {
    const res = await fetch(`${API}/invites/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: CODE,
        to: partnerCode,
        // Zeitfenster für dieses Treffen
        time_start: Date.now(),
        time_end: Date.now() + 2 * 60 * 60 * 1000  // 2 Stunden
      })
    });
    
    if (!res.ok) throw new Error('Invite fehlgeschlagen');
    console.log('[Chat] Bereit-Invite gesendet');
  } catch (err) {
    console.error('[Chat] Invite Error:', err);
    // Nicht fatal - P2P funktioniert trotzdem manchmal ohne Invite
  }
}

function goBackToList() {
  CURRENT_ROOM = null;
  PARTNER_CODE = null;
  PARTNER_NAME = null;
  
  // P2P Connection nicht schließen, sondern im Hintergrund halten
  // Optional: webrtc.cleanup(); wenn du Connection pro Chat schliessen willst
  
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('chatListScreen').style.display = 'block';
  renderChatList();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────
function getMessages() {
  if (!CURRENT_ROOM) return [];
  try {
    return JSON.parse(localStorage.getItem(CHAT_PREFIX + CURRENT_ROOM) || '[]');
  } catch { return []; }
}

function saveMessages(msgs) {
  if (!CURRENT_ROOM) return;
  localStorage.setItem(CHAT_PREFIX + CURRENT_ROOM, JSON.stringify(msgs));
}

function renderMessages() {
  const container = document.getElementById('messages');
  const msgs = getMessages();
  
  container.innerHTML = msgs.map(m => {
    const isMine = m.from === CODE;
    return `
      <div class="message ${isMine ? 'mine' : 'other'}">
        <div class="msg-author">${escapeHtml(m.fromName || m.from)}</div>
        ${escapeHtml(m.text)}
        <div class="msg-time">${new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</div>
      </div>
    `;
  }).join('');
  
  container.scrollTop = container.scrollHeight;
}

// ── SEND MESSAGE (P2P Priority + Fallback) ────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !PARTNER_CODE) return;
  
  const myName = PROFILE?.name || CODE;
  
  // Lokal sofort speichern (UX: sofort sichtbar)
  const msgs = getMessages();
  msgs.push({ from: CODE, fromName: myName, text, ts: Date.now() });
  saveMessages(msgs);
  renderMessages();
  input.value = '';
  
  // Priority: P2P → Server Fallback
  if (webrtc && webrtc.isConnected()) {
    const sent = webrtc.send(text);
    if (sent) {
      console.log('[Chat] Via P2P gesendet');
      updateP2PUI('Online (P2P)', true);
      return;
    }
  }
  
  // Fallback zum Server (wenn Partner offline oder P2P fehlgeschlagen)
  try {
    const res = await fetch(`${API}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: PARTNER_CODE,
        sender_code: CODE,
        sender_name: myName,
        message: text,
        spot_type: 'caching_chat'
      })
    });
    
    if (!res.ok) {
      console.warn('Nachricht nicht gesendet:', res.statusText);
      // TODO: In Outbox speichern für späteren Retry
    } else {
      console.log('[Chat] Via Server gesendet');
      updateP2PUI('Fallback: Server-Modus', false);
    }
  } catch (e) {
    console.error('Fehler beim Senden:', e);
  }
}

// ── HEADER STATUS UPDATE ──────────────────────────────────────────────────
function updateHeaderStatus(status, isP2P) {
  const el = document.getElementById('headerStatus');
  const indicator = document.getElementById('p2pIndicator');
  
  el.innerHTML = `<span class="p2p-indicator ${isP2P ? 'active' : 'inactive'}"></span>${status}`;
  
  isP2PConnected = isP2P;
}

// ── POLLING ───────────────────────────────────────────────────────────────
async function initPolling() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  
  POLL_TIMER = setInterval(async () => {
    if (!CODE) return;
    
    try {
      const res = await fetch(`${API}/messages/${CODE}?spot_type=caching_chat`);
      if (!res.ok) return;
      
      const newMsgs = await res.json();
      if (!newMsgs.length) return;
      
      // Neue Nachrichten in den entsprechenden Chats einfügen
      let renderedAny = false;
      let listNeedsUpdate = false;
      
      newMsgs.forEach(m => {
        const room = [CODE, m.sender_code].sort().join('-');
        const key = CHAT_PREFIX + room;
        
        let msgs = [];
        try { msgs = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
        
        const exists = msgs.some(e => e.from === m.sender_code && e.text === m.message);
        if (!exists) {
          msgs.push({
            from: m.sender_code,
            fromName: m.sender_name,
            text: m.message,
            ts: new Date(m.created_at).getTime()
          });
          localStorage.setItem(key, JSON.stringify(msgs));
          listNeedsUpdate = true;
          
          // Wenn aktueller Chat, neu rendern
          if (room === CURRENT_ROOM) {
            renderMessages();
            renderedAny = true;
          }
        }
      });
      
      if (renderedAny) {
        // Update Header Status wenn Server-Modus aktiv
        updateP2PUI('Server-Modus (Polling)', false);
      }
      if (listNeedsUpdate && !renderedAny) {
        renderChatList();
      }
    } catch (e) {
      console.error('Polling-Fehler:', e);
    }
  }, 5000); // Alle 5 Sekunden
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
function updateP2PUI(active, message) {
  const indicator = document.getElementById('p2pIndicator');
  const statusText = document.getElementById('p2pStatusText');
  const banner = document.getElementById('p2pBanner');
  const bannerText = document.getElementById('p2pBannerText');
  const connStatus = document.getElementById('connectionStatus');
  
  if (!indicator) return;
  
  if (active) {
    indicator.className = 'p2p-indicator p2p-active';
    statusText.textContent = message || 'P2P Aktiv';
    banner.classList.add('show');
    bannerText.textContent = message || 'Direct P2P Connection - Deine Nachrichten sind privat!';
    connStatus.className = 'connection-status p2p';
    connStatus.innerHTML = '🔒 <strong>P2P-Verschlüsselung</strong> - Keine Server-Zwischenspeicherung';
    isP2PConnected = true;
  } else {
    indicator.className = 'p2p-indicator p2p-inactive';
    statusText.textContent = message || 'Server-Modus';
    banner.classList.remove('show');
    connStatus.className = 'connection-status server';
    connStatus.innerHTML = '☁️ <strong>Server-Relay</strong> - Nachrichten werden temporär gespeichert';
    isP2PConnected = false;
  }
  }
  
// ── SERVICE WORKER REGISTRATION ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/chat/sw.js')
    .then(reg => console.log('[SW] Registered:', reg))
    .catch(console.error);
}

// ── INIT ──────────────────────────────────────────────────────────────────
// Autologin versuchen
autoLogin().catch(console.error);
</script>
