<script>
// ── GLOBAL VARIABLES ───────────────────────────────────────────────────────
const API = 'https://spotme-chat-obom.onrender.com/api';

let CODE = null, TOKEN = null, PROFILE = null;
let CURRENT_ROOM = null, PARTNER_CODE = null, PARTNER_NAME = null;
let RENDERED_MSG_COUNT = 0; // FIX: für inkrementelles Rendern in renderMessages()
let POLL_TIMER = null;
const CHAT_PREFIX = 'sm_local_msg_';

// ══════════════════════════════════════════════════════════════════════════
// LOKALE VERSCHLÜSSELUNG (AES-GCM, Web Crypto API)
// Philosophie: Server ist nur 7-Tage-Zwischenspeicher, P2P ist per WebRTC
// (DTLS) verschlüsselt – aber localStorage lag bisher im Klartext auf dem
// Gerät. Das ist das lokale "Backup" (bleibt bis App/Speicher gelöscht wird),
// also muss es genauso codiert sein wie der Rest der Kette.
// Schlüssel wird aus CODE+TOKEN abgeleitet (PBKDF2) – nie gespeichert,
// nur pro Session im Speicher gehalten.
// ══════════════════════════════════════════════════════════════════════════
let _localCryptoKey = null;

async function getLocalCryptoKey() {
  if (_localCryptoKey) return _localCryptoKey;
  if (!CODE || !TOKEN) {
    throw new Error('Kein CODE/TOKEN vorhanden – Verschlüsselung nicht möglich');
  }
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    enc.encode(CODE + ':' + TOKEN),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  _localCryptoKey = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: enc.encode('spotme-chat-local-v1'),
      iterations: 100000,
      hash: 'SHA-256'
    },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  return _localCryptoKey;
}

// Beim Logout: Schlüssel aus dem Speicher werfen
function clearLocalCryptoKey() {
  _localCryptoKey = null;
}

async function encryptLocalData(obj) {
  const key = await getLocalCryptoKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  const combined = new Uint8Array(iv.length + cipherBuf.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipherBuf), iv.length);
  let binary = '';
  combined.forEach(b => binary += String.fromCharCode(b));
  return 'enc1:' + btoa(binary); // Prefix markiert Format-Version
}

async function decryptLocalData(stored) {
  if (typeof stored !== 'string' || !stored.startsWith('enc1:')) {
    // Altes Klartext-Format (vor Verschlüsselungs-Update) → Migration
    return JSON.parse(stored);
  }
  const key = await getLocalCryptoKey();
  const binary = atob(stored.slice(5));
  const combined = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) combined[i] = binary.charCodeAt(i);
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// Wrapper: Nachrichten eines Rooms laden/speichern (ersetzt direkte
// localStorage.getItem/setItem-Aufrufe für Chat-Nachrichten)
async function loadRoomMessages(room) {
  const raw = localStorage.getItem(CHAT_PREFIX + room);
  if (!raw) return [];
  try {
    const msgs = await decryptLocalData(raw);
    return Array.isArray(msgs) ? msgs : [];
  } catch (e) {
    console.error('[Crypto] Entschlüsselung fehlgeschlagen für', room, e);
    return [];
  }
}

async function saveRoomMessages(room, msgs) {
  try {
    const enc = await encryptLocalData(msgs);
    localStorage.setItem(CHAT_PREFIX + room, enc);
  } catch (e) {
    console.error('[Crypto] Verschlüsselung fehlgeschlagen für', room, e);
  }
}

// WebRTC / P2P Status
let webrtc = null;
let isP2PConnected = false;
let p2pConnectionTime = null;

// ── AUTH ──────────────────────────────────────────────────────────────────
async function handleLogin() {
  const code = document.getElementById('loginCode').value.trim();
  const token = document.getElementById('loginToken').value.trim();
  
  if (!code || code.length !== 6) {
    document.getElementById('loginError').textContent = 'Bitte 6-stelligen Code eingeben';
    return;
  }

  // Spot Messenger läuft hier als eigenständige App (kein Trust-Kontext
  // von SpotMe Caching, das seinen eigenen Chat-Layer separat implementiert) →
  // Token ist Pflicht, sonst könnte jeder mit fremdem Code rein.
  if (!token) {
    document.getElementById('loginError').textContent = 'Token erforderlich (siehe SpotMe Caching Profil)';
    return;
  }
  
  try {
    // Echte Server-Verifikation (code + token müssen zusammenpassen)
    const res = await fetch(`${API}/auth/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, token })
    });
    if (!res.ok) {
      throw new Error('Profil nicht gefunden oder ungültiger Token');
    }
    
    const profile = await res.json();
    
    CODE = code;
    TOKEN = token;
    PROFILE = profile;
    
    // localStorage persistieren (im chat Namespace)
    localStorage.setItem('sm_chat_code', code);
    if (token) localStorage.setItem('sm_chat_token', token);
    localStorage.setItem('sm_chat_profile', JSON.stringify(profile));
    
    // UI umschalten
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatListScreen').style.display = 'block';
    
    // WebRTC initialisieren (PeerJS Setup)
    initWebRTC();
    
    // Polling für Server-Nachrichten starten
    initPolling();

    // Web Push registrieren (eigene Subscription für /chat/ Scope)
    initPushNotifications();
    
    // Chat Liste rendern
    renderChatList();

  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

function handleLogout() {
  // Cleanup WebRTC Verbindung
  if (webrtc) {
    webrtc.destroy();
    webrtc = null;
  }
  isP2PConnected = false;
  p2pConnectionTime = null;
  
  // Cleanup Polling
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = null;
  
  // localStorage bereinigen
  localStorage.removeItem('sm_chat_code');
  localStorage.removeItem('sm_chat_token');
  localStorage.removeItem('sm_chat_profile');
  
  // Reset globals
  CODE = null; TOKEN = null; PROFILE = null;
  CURRENT_ROOM = null; PARTNER_CODE = null; PARTNER_NAME = null;
  clearLocalCryptoKey(); // Schlüssel war nur aus CODE+TOKEN abgeleitet, jetzt ungültig
  
  // UI zurücksetzen
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginCode').value = '';
  document.getElementById('loginToken').value = '';
  document.getElementById('loginError').textContent = '';
  
  // P2P UI resetten
  const banner = document.getElementById('p2pBanner');
  const bannerText = document.getElementById('p2pBannerText');
  if (banner) {
    banner.className = 'p2p-banner server';
    bannerText.textContent = 'Verbindung wird hergestellt...';
  }
  }

// Autologin versuchen wenn gespeichert
async function autoLogin() {
  const savedCode = localStorage.getItem('sm_chat_code');
  const savedToken = localStorage.getItem('sm_chat_token');
  
  if (!savedCode) return false;

  // Alte Session ohne Token (aus Zeit vor dem Pflicht-Token) → verwerfen,
  // Nutzer muss sich einmalig mit Token neu einloggen.
  if (!savedToken) {
    localStorage.removeItem('sm_chat_code');
    localStorage.removeItem('sm_chat_profile');
    return false;
  }
  
  try {
    const res = await fetch(`${API}/auth/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: savedCode, token: savedToken })
    });
    if (res.ok) {
      CODE = savedCode;
      TOKEN = savedToken;
      PROFILE = await res.json();
      
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('chatListScreen').style.display = 'block';
      
      initWebRTC();
      initPolling();
      initPushNotifications();
      renderChatList();
      return true;
    }
  } catch (e) {
    console.error('Autologin failed:', e);
  }
  return false;
}

// ── WEB PUSH SETUP ────────────────────────────────────────────────────────
// Fehlte bisher komplett im Chat-Frontend (Auskopplung vom Root-Chat).
// WICHTIG: subscribe() läuft über die /chat/sw.js Registrierung –
// eine alte Subscription der Root-App wirkt hier NICHT, weil
// Push-Events immer an die SW-Registrierung gehen, die subscribed hat.
async function initPushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.warn('[Push] Nicht unterstützt in diesem Browser');
    return;
  }
  if (!CODE) return;

  try {
    const reg = await navigator.serviceWorker.ready; // wartet auf /chat/sw.js

    // Bereits subscribed? Dann nur sicherstellen, dass Server sie kennt.
    let sub = await reg.pushManager.getSubscription();

    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        console.warn('[Push] Berechtigung verweigert');
        return;
      }

      const keyRes = await fetch(`${API}/push/vapid-public-key`);
      const { publicKey } = await keyRes.json();
      if (!publicKey) {
        console.warn('[Push] Kein VAPID Public Key vom Server');
        return;
      }

      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }

    // Subscription beim Server hinterlegen (idempotent, überschreibt alte)
    await fetch(`${API}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOKEN, subscription: sub })
    });

    console.log('[Push] Subscription aktiv für', CODE);
  } catch (err) {
    console.error('[Push] Setup fehlgeschlagen:', err);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// ── WEBRTC / P2P SETUP ────────────────────────────────────────────────────
async function initWebRTC() {
  console.log('[WebRTC] initWebRTC called');

  if (!window.Peer) {
    console.error('[WebRTC] PeerJS not loaded!');
    return;
  }
  if (!window.SpotMeWebRTC) {
    console.error('[WebRTC] SpotMeWebRTC class not found!');
    return;
  }

  console.log('[WebRTC] Instantiated with User:', PROFILE?.name || CODE);

  webrtc = new window.SpotMeWebRTC(CODE, TOKEN, PROFILE?.name || CODE);

  // ── NEU: Peer ist beim Server registriert ──
  webrtc.onPeerReady = (id) => {
    console.log('[Chat] Peer registriert beim Server, ID:', id);
  };

  // ── P2P Datenkanal geöffnet ──
  webrtc.onConnect = (peerId) => {
    console.log('[Chat] P2P Verbindung hergestellt mit:', peerId);
    isP2PConnected = true;
    p2pConnectionTime = new Date();
    updateP2PUI(true, 'P2P Aktiv');
  };

  // ── Nachricht via P2P empfangen ──
  webrtc.onMessage = async (msg) => {
    console.log('[Chat] P2P Nachricht empfangen:', msg);

    // WICHTIG: Room aus Absender-Code berechnen, nicht CURRENT_ROOM nutzen
    // (Nachricht kann ankommen, wenn Chat gar nicht geöffnet ist)
    const room = [CODE, msg.from].sort().join('-');

    const msgs = await loadRoomMessages(room);

    // Duplikat-Check
    const exists = msgs.some(e =>
      e.from === msg.from &&
      e.text === msg.text &&
      Math.abs((e.ts || 0) - (msg.ts || 0)) < 5000
    );

    if (!exists) {
      msgs.push({
        from: msg.from,
        fromName: msg.fromName,
        text: msg.text,
        ts: msg.ts || Date.now()
      });
      await saveRoomMessages(room, msgs);
    }

    // UI aktualisieren
    if (room === CURRENT_ROOM) {
      renderMessages(true);
    }
    renderChatList();
  };

  // ── P2P Verbindung getrennt ──
  webrtc.onDisconnect = (peerId) => {
    console.log('[Chat] P2P Verbindung getrennt:', peerId);
    isP2PConnected = false;
    p2pConnectionTime = null;
    updateP2PUI(false, 'Verbindung getrennt');
  };

  // ── Fehler ──
  webrtc.onError = (err) => {
    console.error('[Chat] WebRTC Error:', err);
    // peer-unavailable ist nicht kritisch — Partner vielleicht noch nicht online
    if (err.type === 'peer-unavailable') {
      updateP2PUI(false, 'Partner nicht online');
      return;
    }
    updateP2PUI(false, 'Fehler: ' + (err.type || 'unknown'));
  };

  // ── NEU: Peer SOFORT beim Login registrieren ──
  await webrtc.register();
}

// ── CHAT LIST ─────────────────────────────────────────────────────────────
async function renderChatList() {
  const container = document.getElementById('chatList');
  if (!CODE) { 
    container.innerHTML = '<p class="text-center" style="padding:2rem;color:var(--muted2);">Keine Chats</p>'; 
    return; 
  }
  
  // Alle Chats aus localStorage finden
  const chats = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith(CHAT_PREFIX)) continue;
    
    const room = key.replace(CHAT_PREFIX, '');
    const codes = room.split('-');
    if (!codes.includes(CODE)) continue;
    
    const partnerCode = codes.find(c => c !== CODE);
    if (!partnerCode) continue;
    
    let msgs = [];
    try { msgs = await decryptLocalData(localStorage.getItem(key)); } catch (e) { msgs = []; }
    if (!Array.isArray(msgs) || !msgs.length) continue;
    
    const lastMsg = msgs[msgs.length - 1];
    const time = new Date(lastMsg.ts);
    const timeStr = time.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const preview = lastMsg.text.length > 30 ? lastMsg.text.slice(0, 30) + '…' : lastMsg.text;
    
    chats.push({
      room, partnerCode, partnerName: lastMsg.fromName || partnerCode,
      lastText: preview, lastTs: lastMsg.ts, timeStr, unread: 0
    });
  }
  
  chats.sort((a, b) => b.lastTs - a.lastTs);
  
  container.innerHTML = chats.map(chat => `
    <div class="chat-item" onclick="openChat('${chat.room}', '${chat.partnerCode}', '${chat.partnerName}')">
      <div class="avatar">${(chat.partnerName[0] || '?').toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(chat.partnerName)}</div>
        <div class="chat-preview">${chat.lastTs === Date.now() ? '🟢 Online' : escapeHtml(chat.lastText)}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${chat.timeStr}</div>
        ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
      </div>
    </div>
  `).join('') || '<p class="text-center" style="padding:2rem;color:var(--muted2);">Noch keine Chats</p>';
}

// ── OPEN CHAT & P2P CONNECTION ────────────────────────────────────────────
async function openChat(room, partnerCode, partnerName) {
  CURRENT_ROOM = room;
  PARTNER_CODE = partnerCode;
  PARTNER_NAME = partnerName;

  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'flex';

  document.getElementById('headerName').textContent = partnerName;
  updateP2PUI(false, 'Verbinde...');

  await renderMessages();

  // Versuch P2P Verbindung herzustellen
  await attemptP2PConnection(partnerCode);
}

async function attemptP2PConnection(partnerCode) {
  // Safety Checks
  if (!webrtc) {
    console.warn('[Chat] WebRTC nicht initialisiert');
    updateP2PUI(false, 'Fehler: WebRTC missing');
    return;
  }

  if (!CODE || !PARTNER_CODE) {
    console.error('[Chat] Missing CODE or PARTNER_CODE:', { CODE, PARTNER_CODE });
    updateP2PUI(false, 'Fehler: Invalid State');
    return;
  }

  try {
    console.log('[Chat] Starte P2P-Verbindung zu:', partnerCode);

    // 1. Bereit-Invite an Partner senden (Signal über Server)
    await sendReadinessInvite(PARTNER_CODE);
    console.log('[Chat] Invite gesendet');

    // 2. Auf eigene Peer-Bereitschaft warten (falls noch nicht registriert)
    await webrtc.connect(PARTNER_CODE, (peerId) => {
      console.log('[Chat] Eigener Peer bereit:', peerId);
    });

    // 3. Verbindung zum Partner initiieren
    // Partner muss ebenfalls registriert sein (Login → register())
    // FIX: Nur die Seite mit dem "kleineren" Code initiiert aktiv.
    // Öffnen beide Seiten den Chat gleichzeitig, entstehen sonst zwei
    // parallele Connections und this.conn wird inkonsistent überschrieben —
    // das war der Grund für "Nachricht kommt erst beim Verlassen des Chats".
    if (CODE < PARTNER_CODE) {
      webrtc.initiateConnection(PARTNER_CODE);
      console.log('[Chat] Verbindung initiert (wir sind Initiator)');
    } else {
      console.log('[Chat] Warte auf eingehende Verbindung von', PARTNER_CODE);
    }

    // Timeout: Nach 3 Sek kein P2P → Server-Modus anzeigen
    setTimeout(() => {
      if (!isP2PConnected) {
        console.log('[Chat] P2P Timeout, bleibe im Server-Modus');
        updateP2PUI(false, 'Server-Modus (Timeout)');
      }
    }, 3000);

  } catch (err) {
    console.error('[Chat] P2P Verbindung fehlgeschlagen:', err);
    updateP2PUI(false, 'Server-Modus');

    // Bei peer-unavailable: Partner vielleicht noch nicht eingeloggt
    // Das ist OK — wir fallen in den Server-Modus (Polling)
    if (err.type === 'peer-unavailable') {
      console.log('[Chat] Partner noch nicht online — Server-Modus aktiv');
    }
  }
        }

async function sendReadinessInvite(partnerCode) {
  try {
    const res = await fetch(`${API}/invites/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: CODE,
        to: partnerCode,
        // Zeitfenster für dieses Treffen
        time_start: Date.now(),
        time_end: Date.now() + 2 * 60 * 60 * 1000  // 2 Stunden
      })
    });
    
    if (!res.ok) throw new Error('Invite fehlgeschlagen');
    console.log('[Chat] Bereit-Invite gesendet');
  } catch (err) {
    console.error('[Chat] Invite Error:', err);
    // Nicht fatal - P2P funktioniert trotzdem manchmal ohne Invite
  }
}

function goBackToList() {
  CURRENT_ROOM = null;
  PARTNER_CODE = null;
  PARTNER_NAME = null;
  
  // P2P Connection nicht schließen, sondern im Hintergrund halten
  // Optional: webrtc.cleanup(); wenn du Connection pro Chat schliessen willst
  
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('chatListScreen').style.display = 'block';
  renderChatList();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────
async function getMessages() {
  if (!CURRENT_ROOM) return [];
  return await loadRoomMessages(CURRENT_ROOM);
}

async function saveMessages(msgs) {
  if (!CURRENT_ROOM) return;
  await saveRoomMessages(CURRENT_ROOM, msgs);
}

async function renderMessages(appendOnly = false) {
  const container = document.getElementById('messages');
  const msgs = await getMessages();

  const renderMsg = (m) => {
    const isMine = m.from === CODE;
    return `
      <div class="message ${isMine ? 'mine' : 'other'}">
        <div class="msg-author">${escapeHtml(m.fromName || m.from)}</div>
        ${escapeHtml(m.text)}
        <div class="msg-time">${new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</div>
      </div>
    `;
  };

  // FIX: Bei jeder eingehenden Nachricht wurde vorher die komplette Liste
  // neu gebaut (innerHTML = alles) → Reflow/Ruckeln bei langen Chats.
  // Jetzt: nur neue Nachrichten anhängen, wenn wir schon im selben Room sind.
  if (appendOnly && container.dataset.room === CURRENT_ROOM && msgs.length > RENDERED_MSG_COUNT) {
    const neue = msgs.slice(RENDERED_MSG_COUNT);
    container.insertAdjacentHTML('beforeend', neue.map(renderMsg).join(''));
  } else {
    container.innerHTML = msgs.map(renderMsg).join('');
    container.dataset.room = CURRENT_ROOM;
  }

  RENDERED_MSG_COUNT = msgs.length;
  container.scrollTop = container.scrollHeight;
}

// ── SEND MESSAGE (P2P Priority + Fallback) ────────────────────────────────
// ── EINGABE: mehrzeilig, Auto-Grow, Strg/Cmd+Enter zum Senden ─────────────
// Return/Enter macht jetzt einen Zeilenumbruch (Standard-Textarea-Verhalten).
// Zum Senden: Button ➤ oder Strg+Enter / Cmd+Enter für Desktop-Tester.
(function setupMsgInput() {
  const input = document.getElementById('msgInput');
  if (!input) return;

  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  input.addEventListener('input', autoGrow);

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendMessage();
    }
    // Normales Enter/Shift+Enter → Standardverhalten der Textarea (neue Zeile)
  });
})();

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();

  if (!text) return;

  if (!PARTNER_CODE) {
    console.error('[Chat] Kein Partner ausgewählt!');
    return;
  }

  const myName = PROFILE?.name || CODE;

  // Lokal sofort speichern (UX: sofort sichtbar)
  const msgs = await getMessages();
  msgs.push({ from: CODE, fromName: myName, text, ts: Date.now() });
  await saveMessages(msgs);
  await renderMessages(true);
  input.value = '';
  input.style.height = 'auto';

  // Priority: P2P → Server Fallback
  if (webrtc && typeof webrtc.isConnected === 'function' && webrtc.isConnected()) {
    try {
      const sent = webrtc.send(text);
      if (sent) {
        console.log('[Chat] Via P2P gesendet');
        updateP2PUI(true, 'P2P Aktiv');
        return;
      }
    } catch (err) {
      console.error('[Chat] P2P Send Error, fällt auf Server zurück:', err);
    }
  }

  // Fallback zum Server
  try {
    const res = await fetch(`${API}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: PARTNER_CODE,
        sender_code: CODE,
        sender_name: myName,
        message: text,
        spot_type: 'caching_chat',
        token: TOKEN
        })
    });

    if (!res.ok) {
      console.warn('[Chat] Nachricht nicht gesendet:', res.status, res.statusText);
    } else {
      console.log('[Chat] Via Server gesendet');
      updateP2PUI(false, 'Server-Modus');
    }
  } catch (e) {
    console.error('[Chat] Netzwerkfehler beim Senden:', e);
  }
 }

// ── HEADER STATUS UPDATE ──────────────────────────────────────────────────
function updateHeaderStatus(status, isP2P) {
  const el = document.getElementById('headerStatus');
  const indicator = document.getElementById('p2pIndicator');
  
  el.innerHTML = `<span class="p2p-indicator ${isP2P ? 'active' : 'inactive'}"></span>${status}`;
  
  isP2PConnected = isP2P;
}

// ── POLLING ───────────────────────────────────────────────────────────────
async function initPolling() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);

  POLL_TIMER = setInterval(async () => {
    if (!CODE) return;

    try {
      // ── 1. Nachrichten abholen (wie bisher) ──
      const res = await fetch(`${API}/messages/${CODE}?spot_type=caching_chat&token=${encodeURIComponent(TOKEN)}`);
      if (res.ok) {
        const newMsgs = await res.json();
        if (newMsgs.length) {
          let renderedAny = false;
          let listNeedsUpdate = false;

          for (const m of newMsgs) {
            const room = [CODE, m.sender_code].sort().join('-');

            const msgs = await loadRoomMessages(room);

            const exists = msgs.some(e =>
              e.from === m.sender_code &&
              e.text === m.message
            );

            if (!exists) {
              msgs.push({
                from: m.sender_code,
                fromName: m.sender_name,
                text: m.message,
                ts: new Date(m.created_at).getTime()
              });
              await saveRoomMessages(room, msgs);
              listNeedsUpdate = true;

              if (room === CURRENT_ROOM) {
                await renderMessages(true);
                renderedAny = true;
              }
            }
          }

          if (renderedAny) {
            updateP2PUI('Server-Modus (Polling)', false);
          }
          if (listNeedsUpdate && !renderedAny) {
            renderChatList();
          }
        }
      }

      // ── 2. NEU: Invites abholen ──
      // Wenn jemand uns chatten will, stellen wir sicher dass unser Peer ready ist
      const invRes = await fetch(`${API}/invites/pending/${CODE}`);
      if (invRes.ok) {
        const invites = await invRes.json();
        if (invites && invites.length > 0) {
          invites.forEach(inv => {
            console.log('[Chat] Pending Invite von:', inv.from || inv.sender_code);

            // Unser Peer sollte bereits registriert sein (Login)
            // Nur sicherstellen, falls etwas schiefgegangen ist
            if (webrtc && !webrtc.isPeerReady()) {
              console.log('[Chat] Peer nicht ready, registriere erneut...');
              webrtc.register();
            }
          });
        }
      }

    } catch (e) {
      console.error('Polling-Fehler:', e);
    }
  }, 5000); // Alle 5 Sekunden
}


// ── MOBILE KEYBOARD DETECTION ─────────────────────────────────────────────
function detectKeyboard() {
  const threshold = window.innerHeight * 0.4; // Wenn Viewport < 60% = Tastatur
  
  if (window.innerHeight < threshold) {
    console.log('[Chat] Keyboard detected');
    document.body.style.overflow = 'hidden';
    document.getElementById('messages').style.paddingBottom = '50px';
  } else {
    console.log('[Chat] Keyboard hidden');
    document.body.style.overflow = '';
    document.getElementById('messages').style.paddingBottom = '';
  }
}

// Resize-Event Listener (wird ausgelöst wenn Keyboard erscheint)
window.addEventListener('resize', () => {
  setTimeout(detectKeyboard, 200); // Kurz warten bis Animation fertig
});

// Direkt nach Login aufrufen
detectKeyboard();

// ── HELPERS ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
function updateP2PUI(active, message) {
  const indicator = document.getElementById('p2pIndicator');
  const statusText = document.getElementById('p2pStatusText');
  const banner = document.getElementById('p2pBanner');
  const bannerText = document.getElementById('p2pBannerText');
  const bannerIcon = banner ? banner.querySelector('.icon') : null;

  if (!indicator) return;

  if (active) {
    indicator.className = 'p2p-indicator p2p-active';
    statusText.textContent = message || 'P2P Aktiv';
    banner.className = 'p2p-banner p2p';
    if (bannerIcon) bannerIcon.textContent = '🔒';
    bannerText.textContent = (message && message !== 'P2P Aktiv')
      ? message
      : 'Direct P2P Connection - Deine Nachrichten sind privat!';
    isP2PConnected = true;
  } else {
    indicator.className = 'p2p-indicator p2p-inactive';
    statusText.textContent = message || 'Server-Modus';
    banner.className = 'p2p-banner server';
    if (bannerIcon) bannerIcon.textContent = '☁️';
    bannerText.innerHTML = 'Server-Relay - Nachrichten werden temporär gespeichert';
    isP2PConnected = false;
  }
}
  
// ── SERVICE WORKER REGISTRATION ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/chat/sw.js')
    .then(reg => console.log('[SW] Registered:', reg))
    .catch(console.error);
}

// ── INIT ──────────────────────────────────────────────────────────────────
// Autologin versuchen
autoLogin().catch(console.error);
</script>
