<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotMe Chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0d12">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0a0d12 0%, #1a1f26 100%);
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Login Screen */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
    }
    #loginScreen .logo { font-size: 3rem; margin-bottom: 1rem; }
    #loginScreen h1 { margin-bottom: 0.5rem; color: #ff4f7b; }
    #loginScreen .subtitle { color: var(--muted2); margin-bottom: 2rem; }
    #loginScreen input {
      width: 100%; max-width: 280px;
      padding: 0.85rem; margin-bottom: 0.75rem;
      border: 1px solid #333; border-radius: 10px;
      background: #1a1f26; color: #fff;
      font-size: 1rem; text-align: center;
    }
    #loginScreen button {
      width: 100%; max-width: 280px;
      padding: 0.85rem; margin-top: 1rem;
      background: #ff4f7b; border: none;
      border-radius: 10px; font-weight: 600;
      color: #fff; cursor: pointer;
    }
    
    /* Chat List */
    #chatListScreen { display: none; height: 100vh; }
    .chat-list-header {
      padding: 1rem; background: #0f1218;
      border-bottom: 1px solid var(--bord);
    }
    .chat-list { overflow-y: auto; height: calc(100vh - 60px); }
    .chat-item {
      padding: 1rem; border-bottom: 1px solid #222;
      display: flex; align-items: center; gap: 1rem;
      cursor: pointer;
    }
    .chat-item:hover { background: #15181e; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #ff4f7b, #ff9f00);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 600; margin-bottom: 0.2rem; }
    .chat-preview {
      font-size: 0.85rem; color: var(--muted2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-meta { text-align: right; min-width: 70px; flex-shrink: 0; }
    .chat-time { font-size: 0.75rem; color: var(--muted); }
    .unread-badge {
      background: #ff4f7b; color: #fff;
      font-size: 0.7rem; padding: 2px 8px;
      border-radius: 10px; margin-top: 5px;
      display: inline-block;
    }
    
    /* Chat Detail */
    #chatDetailScreen { display: none; flex-direction: column; height: 100vh; }
    .chat-header {
      padding: 1rem; background: #0f1218;
      border-bottom: 1px solid var(--bord);
      display: flex; align-items: center; gap: 1rem;
    }
    .back-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }
    .header-info { flex: 1; }
    .header-name { font-weight: 600; }
    .header-status { font-size: 0.75rem; color: var(--muted); }
    .messages-container {
      flex: 1; overflow-y: auto; padding: 1rem;
      background: #0a0d12;
    }
    .message {
      max-width: 75%; padding: 0.6rem 0.9rem;
      border-radius: 12px; margin-bottom: 0.5rem;
      word-wrap: break-word;
    }
    .message.mine {
      align-self: flex-end; margin-left: auto;
      background: linear-gradient(135deg, #ff4f7b, #ff9f00);
    }
    .message.other { align-self: flex-start; background: #1a1f26; }
    .msg-author {
      font-size: 0.7rem; color: #aaa; margin-bottom: 0.2rem;
    }
    .message.mine .msg-author { display: none; }
    .msg-time {
      font-size: 0.65rem; color: #888;
      margin-top: 0.2rem; text-align: right;
    }
    .input-bar {
      padding: 0.75rem 1rem; background: #0f1218;
      border-top: 1px solid var(--bord);
      display: flex; gap: 0.5rem;
    }
    .input-bar input {
      flex: 1; padding: 0.7rem; border-radius: 20px;
      border: 1px solid #333; background: #1a1f26;
      color: #fff; font-size: 1rem;
    }
    .input-bar button {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ff4f7b; border: none;
      color: #fff; font-size: 1.2rem; cursor: pointer;
    }
    
    /* Helpers */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .error { color: #ff4f7b; margin-top: 1rem; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="logo">💬</div>
    <h1>SpotMe Chat</h1>
    <p class="subtitle">Eigenständiger Messenger</p>
    <input type="text" id="loginCode" maxlength="6" placeholder="6-stelliger Code">
    <input type="password" id="loginToken" placeholder="Token (optional)">
    <button onclick="handleLogin()">Anmelden</button>
    <p id="loginError" class="error"></p>
    <a href="/" style="margin-top:1rem; color:#ff4f7b; font-size:0.85rem;">← Zurück zu SpotME Caching</a>
  </div>

  <!-- Chat List -->
  <div id="chatListScreen">
    <div class="chat-list-header">
      <h2>💬 Chats</h2>
      <button class="logout-btn" onclick="handleLogout()" style="float:right;background:none;border:none;color:#ff4f7b;cursor:pointer;font-size:0.85rem;">Abmelden</button>
    </div>
    <div id="chatList" class="chat-list"></div>
  </div>

  <!-- Chat Detail -->
  <div id="chatDetailScreen">
    <div class="chat-header">
      <button class="back-btn" onclick="goBackToList()">←</button>
      <div class="header-info">
        <div class="header-name" id="headerName">...</div>
        <div class="header-status" id="headerStatus">Offline</div>
      </div>
    </div>
    <div id="messages" class="messages-container"></div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

<script>
const API = 'https://spotme-chat-obom.onrender.com/api';

let CODE = null, TOKEN = null, PROFILE = null;
let CURRENT_ROOM = null, PARTNER_CODE = null, PARTNER_NAME = null;
let POLL_TIMER = null;
const CHAT_PREFIX = 'sm_local_msg_';

// ── AUTH ──────────────────────────────────────────────────────────────────
async function handleLogin() {
  const code = document.getElementById('loginCode').value.trim();
  const token = document.getElementById('loginToken').value.trim();
  
  if (!code || code.length !== 6) {
    document.getElementById('loginError').textContent = 'Bitte 6-stelligen Code eingeben';
    return;
  }
  
  try {
    // Profil beim Server prüfen
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['x-spotme-token'] = token;
    
    const res = await fetch(`${API}/profile/${code}?spot=caching`, { headers });
    if (!res.ok) {
      throw new Error('Profil nicht gefunden oder ungültiger Token');
    }
    
    const profile = await res.json();
    
    CODE = code;
    TOKEN = token;
    PROFILE = profile;
    
    // localStorage persistieren (im chat Namespace)
    localStorage.setItem('sm_chat_code', code);
    if (token) localStorage.setItem('sm_chat_token', token);
    localStorage.setItem('sm_chat_profile', JSON.stringify(profile));
    
    // UI umschalten
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatListScreen').style.display = 'block';
    
    initPolling();
    renderChatList();
  } catch (e) {
    document.getElementById('loginError').textContent = e.message;
  }
}

function handleLogout() {
  localStorage.removeItem('sm_chat_code');
  localStorage.removeItem('sm_chat_token');
  localStorage.removeItem('sm_chat_profile');
  
  CODE = null; TOKEN = null; PROFILE = null;
  CURRENT_ROOM = null; PARTNER_CODE = null;
  
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginCode').value = '';
  document.getElementById('loginToken').value = '';
  document.getElementById('loginError').textContent = '';
}

// Autologin wenn gespeichert
async function autoLogin() {
  const savedCode = localStorage.getItem('sm_chat_code');
  const savedToken = localStorage.getItem('sm_chat_token');
  
  if (!savedCode) return false;
  
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (savedToken) headers['x-spotme-token'] = savedToken;
    
    const res = await fetch(`${API}/profile/${savedCode}?spot=caching`, { headers });
    if (res.ok) {
      CODE = savedCode;
      TOKEN = savedToken;
      PROFILE = await res.json();
      
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('chatListScreen').style.display = 'block';
      
      initPolling();
      renderChatList();
      return true;
    }
  } catch {}
  return false;
}

// ── CHAT LIST ─────────────────────────────────────────────────────────────
async function renderChatList() {
  const container = document.getElementById('chatList');
  if (!CODE) { container.innerHTML = '<p class="text-center" style="padding:2rem;color:var(--muted2);">Keine Chats</p>'; return; }
  
  // Alle Chats aus localStorage finden
  const chats = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith(CHAT_PREFIX)) continue;
    
    const room = key.replace(CHAT_PREFIX, '');
    const codes = room.split('-');
    if (!codes.includes(CODE)) continue;
    
    const partnerCode = codes.find(c => c !== CODE);
    if (!partnerCode) continue;
    
    let msgs = [];
    try { msgs = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
    if (!msgs.length) continue;
    
    const lastMsg = msgs[msgs.length - 1];
    const time = new Date(lastMsg.ts);
    const timeStr = time.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const preview = lastMsg.text.length > 30 ? lastMsg.text.slice(0, 30) + '…' : lastMsg.text;
    
    chats.push({
      room, partnerCode, partnerName: lastMsg.fromName || partnerCode,
      lastText: preview, lastTs: lastMsg.ts, timeStr, unread: 0
    });
  }
  
  chats.sort((a, b) => b.lastTs - a.lastTs);
  
  container.innerHTML = chats.map(chat => `
    <div class="chat-item" onclick="openChat('${chat.room}', '${chat.partnerCode}', '${chat.partnerName}')">
      <div class="avatar">${(chat.partnerName[0] || '?').toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(chat.partnerName)}</div>
        <div class="chat-preview">${chat.lastTs === Date.now() ? '🟢 Online' : escapeHtml(chat.lastText)}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${chat.timeStr}</div>
        ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
      </div>
    </div>
  `).join('') || '<p class="text-center" style="padding:2rem;color:var(--muted2);">Noch keine Chats</p>';
}

function openChat(room, partnerCode, partnerName) {
  CURRENT_ROOM = room;
  PARTNER_CODE = partnerCode;
  PARTNER_NAME = partnerName;
  
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'flex';
  
  document.getElementById('headerName').textContent = partnerName;
  document.getElementById('headerStatus').textContent = 'Online'; // TODO: Real Status
  
  renderMessages();
}

function goBackToList() {
  CURRENT_ROOM = null;
  PARTNER_CODE = null;
  PARTNER_NAME = null;
  
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('chatListScreen').style.display = 'block';
  renderChatList();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────
function getMessages() {
  if (!CURRENT_ROOM) return [];
  try {
    return JSON.parse(localStorage.getItem(CHAT_PREFIX + CURRENT_ROOM) || '[]');
  } catch { return []; }
}

function saveMessages(msgs) {
  if (!CURRENT_ROOM) return;
  localStorage.setItem(CHAT_PREFIX + CURRENT_ROOM, JSON.stringify(msgs));
}

function renderMessages() {
  const container = document.getElementById('messages');
  const msgs = getMessages();
  
  container.innerHTML = msgs.map(m => {
    const isMine = m.from === CODE;
    return `
      <div class="message ${isMine ? 'mine' : 'other'}">
        <div class="msg-author">${escapeHtml(m.fromName || m.from)}</div>
        ${escapeHtml(m.text)}
        <div class="msg-time">${new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</div>
      </div>
    `;
  }).join('');
  
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !PARTNER_CODE) return;
  
  const myName = PROFILE?.name || CODE;
  
  // Lokal sofort speichern
  const msgs = getMessages();
  msgs.push({ from: CODE, fromName: myName, text, ts: Date.now() });
  saveMessages(msgs);
  renderMessages();
  input.value = '';
  
  // An Server senden
  try {
    const res = await fetch(`${API}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: PARTNER_CODE,
        sender_code: CODE,
        sender_name: myName,
        message: text,
        spot_type: 'caching_chat'
      })
    });
    
    if (!res.ok) {
      // In Outbox speichern (TODO: IndexedDB)
      console.warn('Nachricht nicht gesendet:', res.statusText);
    }
  } catch (e) {
    console.error('Fehler beim Senden:', e);
  }
}

// ── POLLING ───────────────────────────────────────────────────────────────
async function initPolling() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  
  POLL_TIMER = setInterval(async () => {
    if (!CODE) return;
    
    try {
      const res = await fetch(`${API}/messages/${CODE}?spot_type=caching_chat`);
      if (!res.ok) return;
      
      const newMsgs = await res.json();
      if (!newMsgs.length) return;
      
      // Neue Nachrichten in den entsprechenden Chats einfügen
      let renderedAny = false;
      newMsgs.forEach(m => {
        const room = [CODE, m.sender_code].sort().join('-');
        const key = CHAT_PREFIX + room;
        
        let msgs = [];
        try { msgs = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
        
        const exists = msgs.some(e => e.from === m.sender_code && e.text === m.message);
        if (!exists) {
          msgs.push({
            from: m.sender_code,
            fromName: m.sender_name,
            text: m.message,
            ts: new Date(m.created_at).getTime()
          });
          localStorage.setItem(key, JSON.stringify(msgs));
          
          // Wenn aktueller Chat, neu rendern
          if (room === CURRENT_ROOM) {
            renderMessages();
            renderedAny = true;
          }
        }
      });
      
      if (!renderedAny) renderChatList();
    } catch (e) {
      console.error('Polling-Fehler:', e);
    }
  }, 5000); // Alle 5 Sekunden
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── INIT ──────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/chat/sw.js')
    .catch(console.error);
}

// Autologin versuchen
autoLogin().catch(console.error);
</script>
</body>
</html>
